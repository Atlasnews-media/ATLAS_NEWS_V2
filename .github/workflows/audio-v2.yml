name: AUDIO V2 — Internacional, Nacional y Mercados

on:
  push:
    branches: [main]
    paths:
      - "src/content/editions/**"
      - "src/content/briefings/**"
      - "lab/audio-v2/**"
      - "config/audio/**"
      - "scripts/audio_speech.py"
      - "scripts/test_audio_speech.py"
      - "scripts/prepare-daily-audio.mjs"
      - "scripts/prepare-international-audio.mjs"
      - "scripts/prepare-audio-v2.mjs"
      - "scripts/generate-audio-v2.py"
      - ".github/workflows/audio-v2.yml"
  schedule:
    # Red de seguridad diaria: si el disparo por push falla o queda incompleto,
    # estos barridos idempotentes recuperan y verifican el audio publicado.
    - cron: "30 7 * * *"
      timezone: "America/Santiago"
    - cron: "0 9 * * *"
      timezone: "America/Santiago"
  workflow_dispatch:
    inputs:
      simulate_markets_failure:
        description: "Simular fallo parcial de Mercados"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Comparte lock con el flujo LEGACY manual para impedir dos escritores de audio.
  group: atlas-news-audio-v2
  cancel-in-progress: false

jobs:
  audio-v2:
    name: Generar Portada + Internacional + Nacional + Mercados
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ATLAS_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Descargar repositorio privado
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validar normalización y Lexicon V3
        run: python3 scripts/test_audio_speech.py

      - name: Preparar acceso al repositorio público
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Descargar repositorio público
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          git clone --depth 1 git@github.com:EldeSiempre100/EldeSiempre100.github.io.git \
            "$RUNNER_TEMP/atlas-news-public"

      - name: Esperar publicación web verificada
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          atlas_public_dir="$RUNNER_TEMP/atlas-news-public"

          for attempt in $(seq 1 24); do
            cd "$atlas_public_dir"
            git fetch --quiet origin main
            git reset --hard origin/main >/dev/null

            if jq -e --arg sha "$ATLAS_SOURCE_SHA" \
              '.sourceCommit == $sha' status.json >/dev/null 2>&1; then
              echo "Web verificada para sourceCommit $ATLAS_SOURCE_SHA."
              exit 0
            fi

            echo "Esperando web canónica para $ATLAS_SOURCE_SHA ($attempt/24)..."
            sleep 15
          done

          echo "La web no confirmó sourceCommit $ATLAS_SOURCE_SHA dentro de la ventana de espera." >&2
          exit 1

      - name: Planificar Portada sin regenerar por reloj
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ runner.temp }}/atlas-news-public
          ATLAS_AUDIO_PLAN: ${{ runner.temp }}/atlas-cover-plan.json
          ATLAS_AUDIO_VOICE: ef_dora
          ATLAS_AUDIO_OWNER: audio-v2
        run: node scripts/prepare-daily-audio.mjs

      - name: Planificar Internacional con Alex
        env:
          ATLAS_INTERNATIONAL_PLAN: ${{ runner.temp }}/atlas-international-plan.json
        run: node scripts/prepare-international-audio.mjs

      - name: Planificar Audio V2 por sourceId
        id: audio_v2_plan
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ runner.temp }}/atlas-news-public
          ATLAS_COVER_PLAN: ${{ runner.temp }}/atlas-cover-plan.json
          ATLAS_INTERNATIONAL_PLAN: ${{ runner.temp }}/atlas-international-plan.json
          ATLAS_AUDIO_V2_PLAN: ${{ runner.temp }}/atlas-audio-v2-plan.json
          ATLAS_AUDIO_V2_SIMULATE_MARKETS_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_markets_failure || false }}
        run: node scripts/prepare-audio-v2.mjs

      - name: Restaurar caché de Kokoro
        if: steps.audio_v2_plan.outputs.needs_generation == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-${{ runner.os }}

      - name: Preparar Kokoro una sola vez
        if: steps.audio_v2_plan.outputs.needs_generation == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/kokoro-v2-venv"
          source "$RUNNER_TEMP/kokoro-v2-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy

      - name: Generar salidas válidas en staging
        if: steps.audio_v2_plan.outputs.needs_generation == 'true'
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ runner.temp }}/atlas-news-public
          ATLAS_AUDIO_V2_PLAN: ${{ runner.temp }}/atlas-audio-v2-plan.json
          ATLAS_AUDIO_SPEED: "1.0"
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/kokoro-v2-venv/bin/activate"
          python scripts/generate-audio-v2.py

      - name: Publicar Audio V2 en un único commit
        id: publish
        if: steps.audio_v2_plan.outputs.needs_generation == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
          AUDIO_DATE: ${{ steps.audio_v2_plan.outputs.audio_date }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atlas-news-public"
          git config user.name "ATLAS NEWS Audio V2"
          git config user.email "actions@users.noreply.github.com"
          git add audio/

          if git diff --cached --quiet; then
            echo "Audio V2 sin cambios públicos; no se crea commit."
            echo "public_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Audio V2 — ${AUDIO_DATE}"

          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin main; then
              echo "public_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$attempt" -eq 2 ]]; then
              echo "No fue posible publicar Audio V2 tras un retry controlado." >&2
              exit 1
            fi

            echo "El repositorio público avanzó durante el push; reintentando una sola vez..."
          done

      - name: Verificar publicación remota de Audio V2
        if: steps.audio_v2_plan.outputs.needs_generation == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
          AUDIO_DATE: ${{ steps.audio_v2_plan.outputs.audio_date }}
          AUDIO_PUBLIC_COMMIT: ${{ steps.publish.outputs.public_commit }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atlas-news-public"
          git fetch --quiet origin main

          if [[ -z "$AUDIO_PUBLIC_COMMIT" ]]; then
            echo "No existe commit público reportado por la etapa de publicación." >&2
            exit 1
          fi

          git merge-base --is-ancestor "$AUDIO_PUBLIC_COMMIT" origin/main

          analysis_manifest="$RUNNER_TEMP/analysis-latest-remote.json"
          cover_manifest="$RUNNER_TEMP/latest-remote.json"
          git show origin/main:audio/analysis-latest.json > "$analysis_manifest"
          git show origin/main:audio/latest.json > "$cover_manifest"

          jq -e --arg date "$AUDIO_DATE" --arg sha "$ATLAS_SOURCE_SHA" '
            .date == $date and
            .sourceCommit == $sha and
            (.international | type == "object") and
            (.national | type == "object") and
            (.markets | type == "object")
          ' "$analysis_manifest" >/dev/null

          jq -e --arg date "$AUDIO_DATE" '
            .date == $date and .status == "published"
          ' "$cover_manifest" >/dev/null

          for key in international national markets; do
            status="$(jq -r --arg key "$key" '.[$key].status // "missing"' "$analysis_manifest")"
            if [[ "$status" == "published" ]]; then
              path="$(jq -r --arg key "$key" '.[$key].path' "$analysis_manifest")"
              if [[ -z "$path" || "$path" == "null" ]]; then
                echo "$key figura published pero no tiene path." >&2
                exit 1
              fi
              git cat-file -e "origin/main:${path#/}"
            fi
          done

          echo "Audio V2 verificado en origin/main para ${AUDIO_DATE} y sourceCommit ${ATLAS_SOURCE_SHA}."

      - name: Confirmar idempotencia del plan
        if: steps.audio_v2_plan.outputs.needs_generation != 'true'
        run: echo "Audio V2 idempotente; Kokoro y publicación omitidos."
