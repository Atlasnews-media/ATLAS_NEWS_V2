name: TEMP LAB — diagnosticar Spaces Chatterbox

on:
  push:
    branches: ["lab/alex-chatterbox-v1"]
    paths:
      - ".github/workflows/temp-chatterbox-space-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet gradio_client
      - name: Inspeccionar APIs públicas
        run: |
          python - <<'PY'
          from gradio_client import Client
          spaces = [
              "TONYSTARK1234/Voz-Latina-Chatterbox",
              "jdavibedoya/a-lo-paisa",
          ]
          for space in spaces:
              print("\n=== SPACE", space, "===")
              try:
                  c = Client(space, verbose=False)
                  print(c.view_api(return_format="dict"))
              except Exception as e:
                  print("ERROR:", type(e).__name__, str(e))
          PY
