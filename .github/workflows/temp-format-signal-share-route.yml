name: TEMP — Format signal share route

on:
  push:
    branches:
      - "feature/senales-urls-compartibles"

permissions:
  contents: write

concurrency:
  group: temp-format-signal-share-route
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/senales-urls-compartibles
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format signal route
        run: npx prettier --write 'src/pages/senales/[date]/[section]/[anchor].astro'

      - name: Commit exact formatter output
        run: |
          set -euo pipefail
          if git diff --quiet -- 'src/pages/senales/[date]/[section]/[anchor].astro'; then
            echo "FORMAT_ALREADY_CANONICAL=1"
            exit 0
          fi
          git config user.name "ATLAS NEWS Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add -- 'src/pages/senales/[date]/[section]/[anchor].astro'
          git commit -m "TEMP: aplicar Prettier a ruta Señales"
          git push origin HEAD:feature/senales-urls-compartibles
