name: Repo Pruner Diagnostic

on:
  workflow_dispatch:
    inputs:
      inactive_days:
        description: "Days without commits before a branch is considered inactive"
        required: false
        default: "30"
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  diagnose-branches:
    name: Diagnose inactive branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: chore/repo-pruner-diagnostic
          fetch-depth: 0

      - name: Run paginated Repo Pruner diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/repo-pruner-diagnostic.sh "${{ inputs.inactive_days }}"

      - name: Upload Markdown diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-ramas
          path: diagnostico-ramas.md
          if-no-files-found: error
          retention-days: 30
