name: Temporary Prettier repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/en-una-mirada-densidad'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files reported by CI
        run: >-
          npx prettier --write
          src/components/ArticleHeader.astro
          src/components/ContentCard.astro
          'src/pages/ediciones/[id].astro'
          src/pages/lecturas/index.astro
          'src/pages/mercados/[id].astro'
          'src/pages/nacional/[id].astro'

      - name: Commit formatting repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ArticleHeader.astro src/components/ContentCard.astro 'src/pages/ediciones/[id].astro' src/pages/lecturas/index.astro 'src/pages/mercados/[id].astro' 'src/pages/nacional/[id].astro'
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: repair existing Prettier drift"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
