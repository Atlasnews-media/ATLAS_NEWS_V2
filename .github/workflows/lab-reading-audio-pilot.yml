name: LAB — audio Lectura Seleccionada con Alex

on:
  pull_request:
    paths:
      - "lab/reading-pilot-2026-09-04-activo-seguro-alex.txt"
      - "scripts/lab-generate-reading-pilot.py"
      - ".github/workflows/lab-reading-audio-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-reading-pilot:
    name: Generar piloto Lectura Seleccionada
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio privado
        uses: actions/checkout@v5

      - name: Registrar sourceCommit de la lectura
        run: |
          set -euo pipefail
          source_commit="$(git log -1 --format=%H -- src/content/readings/2026-09-04-reading-activo-seguro-riesgo.md)"
          test -n "$source_commit"
          echo "ATLAS_READING_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "Lectura sourceCommit: $source_commit"

      - name: Preparar acceso al repositorio público
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Descargar repositorio público
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git clone --depth 1 git@github.com:EldeSiempre100/EldeSiempre100.github.io.git \
            "$RUNNER_TEMP/atlas-news-public"

      - name: Restaurar caché de Kokoro
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-${{ runner.os }}

      - name: Generar audio piloto con Alex
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ runner.temp }}/atlas-news-public
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/kokoro-reading-venv"
          source "$RUNNER_TEMP/kokoro-reading-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy
          python scripts/lab-generate-reading-pilot.py

      - name: Publicar evidencia LAB
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atlas-news-public"
          git config user.name "ATLAS NEWS LAB"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lab/audio/reading-pilot-2026-09-04-activo-seguro-alex.mp3 \
            lab/audio/reading-pilot-2026-09-04-activo-seguro-alex.json
          if git diff --cached --quiet; then
            echo "La evidencia del piloto ya estaba actualizada."
          else
            git commit -m "LAB AUD-READ-01 — Lectura Seleccionada con Alex"
            git pull --rebase origin main
            git push origin main
          fi
