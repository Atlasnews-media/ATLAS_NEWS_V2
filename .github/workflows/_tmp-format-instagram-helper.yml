name: TEMP — Format Instagram helper

on:
  pull_request:
    branches: [main]
    paths:
      - tools/social-renderer/prepare-daily-contract.mjs
      - .github/workflows/_tmp-format-instagram-helper.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format exact helper
        run: npx prettier tools/social-renderer/prepare-daily-contract.mjs --write
      - name: Upload exact formatted helper
        uses: actions/upload-artifact@v4
        with:
          name: formatted-instagram-helper
          path: tools/social-renderer/prepare-daily-contract.mjs
          if-no-files-found: error
          retention-days: 1
