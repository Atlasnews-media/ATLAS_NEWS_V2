name: Format indices correction once

on:
  push:
    branches: [fix/indices-scale-blind-page]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/indices-scale-blind-page
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/mercados/indices/index.astro
      - name: Guardar formato
        run: |
          if git diff --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "ATLAS NEWS Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/mercados/indices/index.astro
          git commit -m "style: format indices correction"
          git push origin HEAD:fix/indices-scale-blind-page
