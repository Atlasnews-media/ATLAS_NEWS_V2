name: TMP — Contingencia audio IPC 08-09

on:
  push:
    branches:
      - run/contingency-audio-2026-09-08

permissions:
  contents: read

jobs:
  generate-contingency-audio:
    name: Generar audio Contingencia con Alex
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio privado
        uses: actions/checkout@v5

      - name: Registrar sourceCommit de Contingencia
        run: |
          set -euo pipefail
          source_commit="$(git log -1 --format=%H -- src/content/readings/2026-09-08-reading-ipc-sorpresa-inflacion.md)"
          test -n "$source_commit"
          echo "ATLAS_READING_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "Contingencia sourceCommit: $source_commit"

      - name: Preparar acceso al repositorio público
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Descargar repositorio público
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git clone --depth 1 git@github.com:EldeSiempre100/EldeSiempre100.github.io.git \
            "$RUNNER_TEMP/atlas-news-public"

      - name: Restaurar caché de Kokoro
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-${{ runner.os }}

      - name: Generar audio de Contingencia con Alex
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ runner.temp }}/atlas-news-public
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/kokoro-contingency-venv"
          source "$RUNNER_TEMP/kokoro-contingency-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy
          python scripts/tmp-generate-contingency-audio.py

      - name: Publicar MP3 y metadata
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atlas-news-public"
          git config user.name "ATLAS NEWS Audio"
          git config user.email "actions@users.noreply.github.com"
          git add \
            audio/readings/2026-09-08-reading-ipc-sorpresa-inflacion.mp3 \
            audio/readings/2026-09-08-reading-ipc-sorpresa-inflacion.json
          git commit -m "Audio Contingencia — IPC agosto 2026 con Alex"
          git pull --rebase origin main
          git push origin main
