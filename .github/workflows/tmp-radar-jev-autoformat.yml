name: TEMP — Autoformat RADAR JEV

on:
  push:
    branches:
      - "lab/radar-jev-bridge-2026-09-23"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "lab/radar-jev-bridge-2026-09-23"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Format and commit
        run: |
          set -euo pipefail
          npx prettier --write \
            scripts/lab/radar-editorial/run-jev-memory-judge.mjs \
            scripts/lab/radar-editorial/typesafe-jev-client.mjs \
            --ignore-path /dev/null
          if git diff --quiet; then
            echo "FORMAT_NOOP"
            exit 0
          fi
          git config user.name "ATLAS NEWS LAB Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add -- scripts/lab/radar-editorial/run-jev-memory-judge.mjs scripts/lab/radar-editorial/typesafe-jev-client.mjs
          git commit -m "LAB RADAR: aplicar Prettier al bridge JEV"
          git push origin HEAD:lab/radar-jev-bridge-2026-09-23
