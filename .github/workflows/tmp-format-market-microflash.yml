name: TEMP Format market microflash

on:
  push:
    branches:
      - feature/market-microflash

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/market-microflash
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format blocking files
        run: npx prettier --write public/scripts/live-market-numbers.js astro.config.mjs scripts/audio-cover-presentation.mjs

      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- public/scripts/live-market-numbers.js astro.config.mjs scripts/audio-cover-presentation.mjs; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "ATLAS NEWS Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add public/scripts/live-market-numbers.js astro.config.mjs scripts/audio-cover-presentation.mjs
          git commit -m "Format market microflash and CI blocker"
          git push origin HEAD:feature/market-microflash
