name: LAB — RADAR Editorial isolation contract

on:
  pull_request:
    branches: [main]
    paths:
      - "lab/radar-editorial/**"
      - "scripts/lab/radar-editorial/**"
      - ".github/workflows/lab-radar-editorial-*.yml"

permissions:
  contents: read

concurrency:
  group: lab-radar-editorial-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolation-contract:
    name: Validar perímetro RADAR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar fixture de aislamiento y casos A-C
        run: node scripts/lab/radar-editorial/test-radar-contract.mjs

      - name: Validar contrato BASELINE
        run: node scripts/lab/radar-editorial/test-baseline-contract.mjs

      - name: Validar superficie editorial RADAR
        run: node scripts/lab/radar-editorial/test-editorial-surface.mjs

      - name: Validar bootstrap de estado
        run: node scripts/lab/radar-editorial/validate-radar-state.mjs lab/radar-editorial/state/radar-state.json

      - name: Caso D — probar aislamiento de triggers productivos
        run: |
          set -euo pipefail
          grep -Fq 'branches: [main]' .github/workflows/publish-site.yml
          grep -Fq '"lab/**"' .github/workflows/publish-site.yml
          grep -Fq '"scripts/lab/**"' .github/workflows/publish-site.yml
          grep -Fq 'branches: [main]' .github/workflows/audio-v2.yml
          ! grep -Fq 'radar-runtime/editorial' .github/workflows/publish-site.yml
          ! grep -Fq 'radar-runtime/editorial' .github/workflows/audio-v2.yml
          ! grep -Fq 'radar-runtime/editorial' .github/workflows/instagram-carousel-publish-automatic.yml
          ! grep -Fq 'radar-runtime/editorial' .github/workflows/reel-maker-v2.yml
          ! grep -Fq 'radar-runtime/editorial' .github/workflows/instagram-reel-publish-v2.yml
          ! grep -Fq 'radar-runtime/editorial' .github/workflows/social-renderer-post-publish.yml
          grep -Fq 'branches: [main]' .github/workflows/instagram-carousel-watchdog.yml
          ! grep -Fq 'radar-runtime/editorial' .github/workflows/instagram-carousel-watchdog.yml
          ! grep -Eq '^  push:' .github/workflows/instagram-carousel-publish-automatic.yml
          ! grep -Eq '^  push:' .github/workflows/reel-maker-v2.yml
          ! grep -Eq '^  push:' .github/workflows/instagram-reel-publish-v2.yml
          grep -Fq -- "--exclude='radar-editorial/'" .github/workflows/lab-site.yml
          echo 'CASE D TRIGGER ISOLATION: PASS'

      - name: Caso E — simular escritor lateral concurrente
        run: bash scripts/lab/radar-editorial/test-public-concurrency.sh

      - name: Comprobar sintaxis de scripts BASELINE
        run: |
          set -euo pipefail
          node --check scripts/lab/radar-editorial/validate-baseline-run.mjs
          node --check scripts/lab/radar-editorial/build-baseline-view.mjs
          node --check scripts/lab/radar-editorial/build-editorial-surface.mjs
          node --check scripts/lab/radar-editorial/test-editorial-surface.mjs
          node --check scripts/lab/radar-editorial/verify-baseline-publication.mjs

      - name: Comprobar formato RADAR
        run: |
          set -euo pipefail
          npx prettier --write \
            "lab/radar-editorial/**/*.{json,md}" \
            "scripts/lab/radar-editorial/*.mjs" \
            ".github/workflows/lab-radar-editorial-*.yml" \
            --ignore-path /dev/null
          git diff -- scripts/lab/radar-editorial/validate-baseline-run.mjs scripts/lab/radar-editorial/verify-baseline-publication.mjs
          test -z "$(git diff --name-only)"

      - name: Comprobar sintaxis shell
        run: bash -n scripts/lab/radar-editorial/test-public-concurrency.sh
