name: TEMP Format market refresh

on:
  push:
    branches:
      - feature/market-data-refresh

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/market-data-refresh
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format market refresh files
        run: npx prettier --write scripts/recover-market-snapshot.mjs scripts/validate-market-pulse-freshness.mjs

      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- scripts/recover-market-snapshot.mjs scripts/validate-market-pulse-freshness.mjs; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "ATLAS NEWS Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/recover-market-snapshot.mjs scripts/validate-market-pulse-freshness.mjs
          git commit -m "Format market refresh scripts"
          git push origin HEAD:feature/market-data-refresh
