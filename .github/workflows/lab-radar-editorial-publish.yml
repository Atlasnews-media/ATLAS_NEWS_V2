name: LAB — RADAR Editorial publisher

on:
  workflow_run:
    workflows: ["LAB — RADAR Editorial runtime gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lab-radar-editorial-publisher
  cancel-in-progress: false

jobs:
  publish-radar:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'radar-runtime/editorial'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime exacto
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Revalidar artefacto antes de publicar
        run: node scripts/lab/radar-editorial/validate-radar-artifact.mjs lab/radar-editorial/runtime/latest.json

      - name: Preparar acceso al repositorio público
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Publicar exclusivamente RADAR
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/atlas-news-public"
          source="lab/radar-editorial/runtime/latest.json"
          target="lab/radar-editorial/latest.json"

          git clone --depth 1 \
            git@github.com:Atlasnews-media/Atlasnews-media.github.io.git \
            "$public"

          mkdir -p "$public/lab/radar-editorial"
          cp "$source" "$public/$target"

          cd "$public"
          git config user.name "ATLAS NEWS RADAR LAB Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$target"

          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "RADAR público ya coincide con el fixture." 
          else
            if printf '%s\n' "$staged" | grep -Ev '^lab/radar-editorial/' >/dev/null; then
              echo "RADAR PUBLIC SCOPE FAIL" >&2
              printf '%s\n' "$staged" >&2
              exit 1
            fi

            run_id="$(node -p "JSON.parse(require('fs').readFileSync('$target','utf8')).radarRunId")"
            git commit -m "LAB RADAR ${run_id}"

            published=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                published=true
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep 2; fi
            done
            if [[ "$published" != true ]]; then
              echo "RADAR publish failed after 3 attempts" >&2
              exit 1
            fi
          fi

          git fetch --quiet origin main
          git show origin/main:"$target" > "$RUNNER_TEMP/radar-remote.json"

      - name: Verificar identidad remota RADAR
        run: >-
          node scripts/lab/radar-editorial/verify-radar-identity.mjs
          lab/radar-editorial/runtime/latest.json
          "$RUNNER_TEMP/radar-remote.json"
