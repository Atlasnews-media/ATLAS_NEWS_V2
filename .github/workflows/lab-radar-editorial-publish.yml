name: LAB — RADAR Editorial publisher

on:
  workflow_run:
    workflows: ["LAB — RADAR Editorial runtime gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lab-radar-editorial-publisher
  cancel-in-progress: false

jobs:
  publish-radar:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'radar-runtime/editorial'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout runtime exacto
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determinar elegibilidad de publicación
        id: eligibility
        run: |
          set -euo pipefail
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq 'lab/radar-editorial/runtime/latest.json'; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "RADAR publisher safe no-op: checkpoint sin handoff READY."
          fi

      - name: Revalidar baseline antes de publicar
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          node scripts/lab/radar-editorial/validate-radar-artifact.mjs lab/radar-editorial/runtime/latest.json
          node scripts/lab/radar-editorial/validate-baseline-run.mjs --latest lab/radar-editorial/runtime/latest.json

      - name: Preparar acceso al repositorio público
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Publicar run BASELINE exclusivamente en RADAR
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/atlas-news-public"
          latest="lab/radar-editorial/runtime/latest.json"
          run_id="$(node -p "JSON.parse(require('fs').readFileSync('$latest','utf8')).radarRunId")"
          run_path="$(node -p "JSON.parse(require('fs').readFileSync('$latest','utf8')).runPath")"
          target_latest="lab/radar-editorial/latest.json"
          target_index="lab/radar-editorial/index.html"
          target_run="lab/radar-editorial/runs/$run_id"

          git clone --depth 1 \
            git@github.com:Atlasnews-media/Atlasnews-media.github.io.git \
            "$public"

          mkdir -p "$public/lab/radar-editorial/runs"
          if [[ -d "$public/$target_run" ]]; then
            if ! diff -qr "$run_path" "$public/$target_run"; then
              echo "RADAR IDEMPOTENCY FAIL: radarRunId ya existe con contenido distinto" >&2
              exit 1
            fi
          else
            cp -R "$run_path" "$public/$target_run"
          fi
          cp "$latest" "$public/$target_latest"
          cp "$run_path/index.html" "$public/$target_index"

          cd "$public"
          git config user.name "ATLAS NEWS RADAR LAB Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$target_latest" "$target_index" "$target_run"

          staged="$(git diff --cached --name-only)"
          if [[ -n "$staged" ]]; then
            if printf '%s\n' "$staged" | grep -Ev '^lab/radar-editorial/' >/dev/null; then
              echo "RADAR PUBLIC SCOPE FAIL" >&2
              printf '%s\n' "$staged" >&2
              exit 1
            fi

            git commit -m "LAB RADAR BASELINE ${run_id}"
            published=false
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                git rebase --abort 2>/dev/null || true
              elif git push origin main; then
                published=true
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep 2; fi
            done
            if [[ "$published" != true ]]; then
              echo "RADAR publish failed after 3 attempts" >&2
              exit 1
            fi
          else
            echo "RADAR público ya coincide con este radarRunId."
          fi

          git fetch --quiet origin main
          git show origin/main:"$target_latest" > "$RUNNER_TEMP/radar-remote-latest.json"
          git show origin/main:"$target_run/publish-request.json" > "$RUNNER_TEMP/radar-remote-request.json"
          git cat-file -e "origin/main:$target_index"
          git cat-file -e "origin/main:$target_run/result.json"

      - name: Verificar identidad remota BASELINE
        if: steps.eligibility.outputs.eligible == 'true'
        run: >-
          node scripts/lab/radar-editorial/verify-baseline-publication.mjs
          lab/radar-editorial/runtime/latest.json
          "$RUNNER_TEMP/radar-remote-latest.json"
          "$RUNNER_TEMP/radar-remote-request.json"
