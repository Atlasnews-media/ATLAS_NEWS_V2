name: LAB — RADAR Editorial publisher

on:
  workflow_run:
    workflows: ["LAB — RADAR Editorial runtime gate", "LAB — RADAR Editorial ingest"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: lab-radar-editorial-publisher
  cancel-in-progress: false

jobs:
  publish-radar:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (
        (
          github.event.workflow_run.name == 'LAB — RADAR Editorial runtime gate' &&
          github.event.workflow_run.head_branch == 'radar-runtime/editorial'
        ) ||
        (
          github.event.workflow_run.name == 'LAB — RADAR Editorial ingest' &&
          github.event.workflow_run.head_branch == 'radar-ingress/editorial'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar handoff de ingest
        if: github.event.workflow_run.name == 'LAB — RADAR Editorial ingest'
        uses: actions/download-artifact@v4
        with:
          name: radar-ingest-handoff
          path: ${{ runner.temp }}/radar-ingest-handoff
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolver commit runtime exacto
        id: runtime
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_WORKFLOW" = "LAB — RADAR Editorial ingest" ]]; then
            handoff="$RUNNER_TEMP/radar-ingest-handoff/handoff.json"
            test -f "$handoff"
            runtime_sha="$(node -p "JSON.parse(require('fs').readFileSync('$handoff','utf8')).runtimeCommit")"
            [[ "$runtime_sha" =~ ^[0-9a-f]{40}$ ]]
          else
            runtime_sha="$SOURCE_HEAD_SHA"
          fi
          echo "sha=$runtime_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout runtime exacto
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.runtime.outputs.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determinar elegibilidad de publicación
        id: eligibility
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/radar-publish-paths.txt"
          git diff-tree --no-commit-id --name-only -r HEAD > "$changed"

          if grep -Fxq 'lab/radar-editorial/runtime/latest.json' "$changed"; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "publish_run=true" >> "$GITHUB_OUTPUT"
          elif grep -Fxq 'lab/radar-editorial/runtime/surface-refresh.json' "$changed"; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "publish_run=false" >> "$GITHUB_OUTPUT"
            echo "RADAR surface refresh: reutiliza el último run READY sin reescribirlo."
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "publish_run=false" >> "$GITHUB_OUTPUT"
            echo "RADAR publisher safe no-op: checkpoint sin handoff READY."
          fi

      - name: Revalidar corrida RADAR antes de publicar
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          node scripts/lab/radar-editorial/validate-radar-artifact.mjs lab/radar-editorial/runtime/latest.json
          node scripts/lab/radar-editorial/validate-baseline-run.mjs --latest lab/radar-editorial/runtime/latest.json

      - name: Checkout herramientas de superficie desde main
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          path: .radar-main-tools
          fetch-depth: 1

      - name: Construir superficie editorial desde artefactos READY
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          surface="$RUNNER_TEMP/radar-surface"
          node .radar-main-tools/scripts/lab/radar-editorial/build-editorial-surface.mjs \
            --runtime-root lab/radar-editorial/runtime \
            --output "$surface"

          latest_run="$(node -p "JSON.parse(require('fs').readFileSync('lab/radar-editorial/runtime/latest.json','utf8')).radarRunId")"
          surface_run="$(node -p "JSON.parse(require('fs').readFileSync('$surface/surface-manifest.json','utf8')).radarRunId")"
          test "$surface_run" = "$latest_run"

      - name: Preparar acceso al repositorio público
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Publicar superficie editorial exclusivamente en RADAR
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/atlas-news-public"
          surface="$RUNNER_TEMP/radar-surface"
          latest="lab/radar-editorial/runtime/latest.json"
          run_id="$(node -p "JSON.parse(require('fs').readFileSync('$latest','utf8')).radarRunId")"
          run_path="$(node -p "JSON.parse(require('fs').readFileSync('$latest','utf8')).runPath")"
          publish_run="${{ steps.eligibility.outputs.publish_run }}"
          target_latest="lab/radar-editorial/latest.json"
          target_index="lab/radar-editorial/index.html"
          target_run="lab/radar-editorial/runs/$run_id"
          target_archive="lab/radar-editorial/archivo"
          target_trace="lab/radar-editorial/trazabilidad"

          git clone --depth 1 \
            git@github.com:Atlasnews-media/Atlasnews-media.github.io.git \
            "$public"

          mkdir -p "$public/lab/radar-editorial/runs"
          if [[ "$publish_run" = "true" ]]; then
            if [[ -d "$public/$target_run" ]]; then
              if ! diff -qr "$run_path" "$public/$target_run"; then
                echo "RADAR IDEMPOTENCY FAIL: radarRunId ya existe con contenido distinto" >&2
                exit 1
              fi
            else
              cp -R "$run_path" "$public/$target_run"
            fi
          else
            test -d "$public/$target_run"
            test -f "$public/$target_run/result.json"
            test -f "$public/$target_run/publish-request.json"
          fi

          cp "$latest" "$public/$target_latest"
          cp "$surface/current/index.html" "$public/$target_index"

          for section in internacional nacional mercados; do
            rm -rf "$public/lab/radar-editorial/$section"
            cp -R "$surface/current/$section" "$public/lab/radar-editorial/$section"
          done

          mkdir -p "$public/$target_archive" "$public/$target_trace"
          cp "$surface/current/archivo/index.html" "$public/$target_archive/index.html"

          for source_dir in "$surface/history"/*; do
            [[ -d "$source_dir" ]] || continue
            historical_run="$(basename "$source_dir")"
            historical_target="$public/$target_archive/$historical_run"
            if [[ ! -d "$historical_target" ]]; then
              cp -R "$source_dir" "$historical_target"
            fi
          done

          for source_dir in "$surface/trace"/*; do
            [[ -d "$source_dir" ]] || continue
            trace_run="$(basename "$source_dir")"
            trace_target="$public/$target_trace/$trace_run"
            if [[ ! -d "$trace_target" ]]; then
              cp -R "$source_dir" "$trace_target"
            fi
          done

          cp "$surface/surface-manifest.json" \
            "$public/lab/radar-editorial/surface-manifest.json"

          cd "$public"
          git config user.name "ATLAS NEWS RADAR LAB Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -- lab/radar-editorial

          staged="$(git diff --cached --name-only)"
          if [[ -n "$staged" ]]; then
            if printf '%s\n' "$staged" | grep -Ev '^lab/radar-editorial/' >/dev/null; then
              echo "RADAR PUBLIC SCOPE FAIL" >&2
              printf '%s\n' "$staged" >&2
              exit 1
            fi

            git commit -m "LAB RADAR surface ${run_id}"
            published=false
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                git rebase --abort 2>/dev/null || true
              elif git push origin main; then
                published=true
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep 2; fi
            done
            if [[ "$published" != true ]]; then
              echo "RADAR publish failed after 3 attempts" >&2
              exit 1
            fi
          else
            echo "RADAR público ya coincide con esta superficie."
          fi

          git fetch --quiet origin main
          git show origin/main:"$target_latest" > "$RUNNER_TEMP/radar-remote-latest.json"
          git show origin/main:"$target_run/publish-request.json" > "$RUNNER_TEMP/radar-remote-request.json"
          git cat-file -e "origin/main:$target_index"
          git cat-file -e "origin/main:$target_run/result.json"
          git cat-file -e "origin/main:lab/radar-editorial/internacional/index.html"
          git cat-file -e "origin/main:lab/radar-editorial/nacional/index.html"
          git cat-file -e "origin/main:lab/radar-editorial/mercados/index.html"
          git cat-file -e "origin/main:$target_archive/$run_id/internacional/index.html"
          git cat-file -e "origin/main:$target_archive/$run_id/nacional/index.html"
          git cat-file -e "origin/main:$target_archive/$run_id/mercados/index.html"
          git cat-file -e "origin/main:$target_trace/$run_id/index.html"
          git cat-file -e "origin/main:lab/radar-editorial/surface-manifest.json"

      - name: Verificar identidad remota RADAR
        if: steps.eligibility.outputs.eligible == 'true'
        run: >-
          node scripts/lab/radar-editorial/verify-baseline-publication.mjs
          lab/radar-editorial/runtime/latest.json
          "$RUNNER_TEMP/radar-remote-latest.json"
          "$RUNNER_TEMP/radar-remote-request.json"
