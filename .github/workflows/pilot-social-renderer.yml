name: Pilot — Social Renderer

on:
  push:
    branches:
      - pilot/social-renderer
    paths:
      - "pilot/social-renderer/**"
      - ".github/workflows/pilot-social-renderer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-social-renderer
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/pilot/social-renderer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Restore renderer dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: pilot/social-renderer/node_modules
          key: ${{ runner.os }}-social-renderer-node-${{ hashFiles('pilot/social-renderer/package.json') }}

      - name: Restore Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-social-renderer-playwright-1.62.1

      - name: Install renderer dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: pilot/social-renderer
        run: npm install --no-audit --no-fund

      - name: Ensure Chromium
        working-directory: pilot/social-renderer
        run: npx playwright install chromium

      - name: Render social assets
        working-directory: pilot/social-renderer
        run: npm run render

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-news-social-renderer-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pilot/social-renderer/output/*.png
            pilot/social-renderer/output/benchmark.json
          if-no-files-found: error
          retention-days: 7
