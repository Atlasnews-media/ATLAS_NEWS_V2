name: LAB — RADAR JEV resolver

on:
  push:
    branches:
      - "radar-ingress/editorial"
    paths:
      - "lab/radar-editorial/jev-requests/*.json"

permissions:
  contents: write

jobs:
  detect-request:
    name: Detectar request JEV ingress
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      request_path: ${{ steps.request.outputs.path }}
      request_ref: ${{ steps.request.outputs.ref }}

    steps:
      - name: Checkout request exacta
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gate fail-closed del buzón JEV
        id: request
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "radar-ingress/editorial"
          before="${{ github.event.before }}"
          changed="$RUNNER_TEMP/jev-ingress-changes.txt"
          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA" > "$changed"
          else
            git diff --name-status "$before" "$GITHUB_SHA" > "$changed"
          fi
          cat "$changed"
          test "$(wc -l < "$changed" | tr -d " ")" = "1"
          status="$(cut -f1 "$changed")"
          request="$(cut -f2 "$changed")"
          test "$status" = "A"
          [[ "$request" =~ ^lab/radar-editorial/jev-requests/[A-Za-z0-9._-]+\.json$ ]]
          test -f "$request"
          echo "path=$request" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  resolve-jev:
    name: Ejecutar motor JEV durable
    needs: detect-request
    uses: Atlasnews-media/ATLAS_NEWS_V2/.github/workflows/lab-radar-editorial-jev-engine.yml@main
    with:
      request_path: ${{ needs.detect-request.outputs.request_path }}
      request_ref: ${{ needs.detect-request.outputs.request_ref }}
    secrets: inherit
