name: Instagram Reel — Automatic from F4D

on:
  workflow_run:
    workflows: ["Reel Maker V2 — post-publication artifact"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_commit:
        description: "sourceCommit con artifact canónico F4D vigente"
        required: true
        type: string
      retry_depth:
        description: "Profundidad interna de reintento automático (0-2)"
        required: false
        default: "0"
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instagram-reel-publish-v2.yml"
      - ".github/workflows/instagram-reel-publish-live-test.yml"
      - "tools/reel_maker/consume_reel_artifact.py"
      - "tools/reel_maker/publish_reel_artifact.sh"
      - "tools/reel_maker/reconcile_instagram_reel.py"
      - "tools/reel_maker/test_reconcile_instagram_reel.py"

permissions:
  actions: write
  contents: read

concurrency:
  group: >-
    instagram-reel-f4e-v2-${{
      github.event_name == 'workflow_dispatch' && inputs.source_commit ||
      github.event_name == 'workflow_run' && github.event.workflow_run.head_sha ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar runtime F4E sin Meta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Syntax-check F4E runtime
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/reel_maker/consume_reel_artifact.py \
            tools/reel_maker/reconcile_instagram_reel.py \
            tools/reel_maker/test_reconcile_instagram_reel.py
          python3 tools/reel_maker/test_reconcile_instagram_reel.py
          bash -n tools/reel_maker/publish_reel_artifact.sh

      - name: Verify latest canonical F4D artifact is discoverable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl -fsSL -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "https://atlasnews-media.github.io/status.json?f4e-pr=${GITHUB_RUN_ID}")"
          edition_id="$(jq -er '.latestDaily.id | select(type == "string" and length > 0)' <<<"$status")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          source_id=""
          for ext in md mdx; do
            candidate="src/content/editions/${edition_id}.${ext}"
            if git cat-file -e "origin/main:${candidate}" 2>/dev/null; then
              source_id="$candidate"
              break
            fi
          done
          test -n "$source_id" || {
            echo "Fail-closed: latest public edition file not found on origin/main."
            exit 9
          }
          source_commit="$(git log -1 --format=%H origin/main -- "$source_id")"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Fail-closed: latest daily sourceCommit is invalid."
            exit 10
          }
          artifact_name="atlas-news-reel-canonical-${source_commit}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          count="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.expired == false and .name == $name)] | length' <<<"$artifacts")"
          test "$count" -ge 1 || {
            echo "Fail-closed: no unexpired canonical F4D artifact found for current public edition."
            exit 11
          }
          echo "PASS: canonical F4D artifact is discoverable. No download or Meta POST executed."

  publish:
    name: Publicar Reel canónico desde F4D
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_commit: ${{ steps.handoff.outputs.source_commit || steps.upstream.outputs.source_commit }}
    env:
      ATLAS_PUBLIC_STATUS_URL: https://atlasnews-media.github.io/status.json
      INSTAGRAM_API_VERSION: v23.0
      INSTAGRAM_EXPECTED_USERNAME: _atlas_news

    steps:
      - name: Checkout F4E runtime
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Resolve canonical F4D artifact
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          INPUT_SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" = "workflow_run" ]]; then
            upstream_run_id="$EVENT_RUN_ID"
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${upstream_run_id}/artifacts")"
            count="$(jq '[.artifacts[] | select(.expired == false and (.name | startswith("atlas-news-reel-canonical-")))] | length' <<<"$artifacts")"
            if [[ "$count" = "0" ]]; then
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "Safe no-op: F4D completed without a canonical Reel artifact."
              exit 0
            fi
            [[ "$count" = "1" ]] || {
              echo "Fail-closed: expected exactly one canonical F4D artifact, found $count."
              exit 40
            }
            artifact_id="$(jq -r '.artifacts[] | select(.expired == false and (.name | startswith("atlas-news-reel-canonical-"))) | .id' <<<"$artifacts")"
            artifact_name="$(jq -r '.artifacts[] | select(.expired == false and (.name | startswith("atlas-news-reel-canonical-"))) | .name' <<<"$artifacts")"
          else
            source_commit="$INPUT_SOURCE_COMMIT"
            [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Fail-closed: workflow_dispatch source_commit must be a full SHA."
              exit 41
            }
            artifact_name="atlas-news-reel-canonical-${source_commit}"
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
            candidate="$(jq -c --arg name "$artifact_name" '
              [.artifacts[]
               | select(.expired == false and .name == $name)
               | select(.workflow_run.id != null)]
              | sort_by(.created_at)
              | reverse
              | .[0] // empty
            ' <<<"$artifacts")"
            [[ -n "$candidate" ]] || {
              echo "Fail-closed: no unexpired canonical F4D artifact for sourceCommit=$source_commit."
              echo "Use Instagram Reel — Controlled recovery to regenerate only through F4D."
              exit 42
            }
            artifact_id="$(jq -r '.id' <<<"$candidate")"
            upstream_run_id="$(jq -r '.workflow_run.id' <<<"$candidate")"
            upstream="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${upstream_run_id}")"
            [[ "$(jq -r '.name' <<<"$upstream")" = "Reel Maker V2 — post-publication artifact" ]] || {
              echo "Fail-closed: artifact did not originate from canonical F4D workflow."
              exit 43
            }
            [[ "$(jq -r '.conclusion' <<<"$upstream")" = "success" ]] || {
              echo "Fail-closed: artifact F4D run was not successful."
              exit 44
            }
            [[ "$(jq -r '.head_branch' <<<"$upstream")" = "main" ]] || {
              echo "Fail-closed: artifact F4D run did not execute from main."
              exit 45
            }
          fi

          resolved_source_commit="${artifact_name#atlas-news-reel-canonical-}"
          [[ "$resolved_source_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Fail-closed: canonical F4D artifact name does not contain a valid sourceCommit."
            exit 46
          }
          echo "source_commit=$resolved_source_commit" >> "$GITHUB_OUTPUT"

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "run_id=$upstream_run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact canonical F4D artifact
        if: steps.upstream.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upstream.outputs.artifact_id }}
          path: _reel_handoff
          run-id: ${{ steps.upstream.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify F4D artifact identity, SHA256 and idempotency
        if: steps.upstream.outputs.eligible == 'true'
        id: handoff
        run: |
          python3 tools/reel_maker/consume_reel_artifact.py \
            --artifact-dir _reel_handoff \
            --artifact-name "${{ steps.upstream.outputs.artifact_name }}" \
            --status-url "$ATLAS_PUBLIC_STATUS_URL"

      - name: Record already-published handoff no-op
        if: steps.upstream.outputs.eligible == 'true' && steps.handoff.outputs.already_published == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.handoff.outputs.source_commit }}
          MP4_SHA256: ${{ steps.handoff.outputs.mp4_sha256 }}
          UPSTREAM_RUN_ID: ${{ steps.upstream.outputs.run_id }}
        run: |
          {
            echo "### F4D → F4E — ALREADY_PUBLISHED_VERIFIED"
            echo "Source commit: $SOURCE_COMMIT"
            echo "F4D run: $UPSTREAM_RUN_ID"
            echo "MP4 SHA256 verified: $MP4_SHA256"
            echo "No regeneration, staging or Meta POST was executed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify secrets and resolve Instagram session
        if: steps.upstream.outputs.eligible == 'true' && steps.handoff.outputs.already_published != 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          ATLAS_PAGES_DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$INSTAGRAM_ACCESS_TOKEN" || { echo "BLOCKED_EXTERNAL: INSTAGRAM_ACCESS_TOKEN missing"; exit 56; }
          test -n "$ATLAS_PAGES_DEPLOY_KEY" || { echo "BLOCKED_EXTERNAL: ATLAS_PAGES_DEPLOY_KEY missing"; exit 57; }
          node tools/social-renderer/resolve-instagram-session.mjs

      - name: Publish exact F4D artifact
        if: steps.upstream.outputs.eligible == 'true' && steps.handoff.outputs.already_published != 'true'
        env:
          SOURCE_COMMIT: ${{ steps.handoff.outputs.source_commit }}
          REEL_DIR: ${{ steps.handoff.outputs.reel_dir }}
          MP4_FILE: ${{ steps.handoff.outputs.mp4_file }}
          MP4_SHA256: ${{ steps.handoff.outputs.mp4_sha256 }}
          ARTIFACT_NAME: ${{ steps.upstream.outputs.artifact_name }}
          UPSTREAM_RUN_ID: ${{ steps.upstream.outputs.run_id }}
          ATLAS_PAGES_DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: bash tools/reel_maker/publish_reel_artifact.sh

      - name: Record F4D safe no-op
        if: steps.upstream.outputs.eligible == 'false'
        run: |
          {
            echo "### F4D → F4E — SAFE NO-OP"
            echo "Upstream Reel Maker completed successfully but produced no canonical artifact."
            echo "Nothing was regenerated or published."
          } >> "$GITHUB_STEP_SUMMARY"

  autorecover:
    needs: publish
    if: always() && needs.publish.result == 'failure' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit || inputs.source_commit || github.event.workflow_run.head_sha || '' }}
      RETRY_DEPTH: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_depth || '0' }}

    steps:
      - name: Dispatch bounded automatic retry
        run: |
          set -euo pipefail
          depth="${RETRY_DEPTH:-0}"
          [[ "$depth" =~ ^[0-9]+$ ]] || depth=0

          if (( depth >= 2 )); then
            echo "Retry budget exhausted at depth=${depth}; maximum three workflow attempts reached."
            exit 0
          fi

          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No exact sourceCommit available for safe Instagram Reel retry; refusing ambiguous redispatch."
            exit 0
          fi

          next=$((depth + 1))
          gh workflow run instagram-reel-publish-v2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_commit="$SOURCE_COMMIT" \
            -f retry_depth="$next"
          echo "Automatic Instagram Reel retry dispatched sourceCommit=${SOURCE_COMMIT} retryDepth=${next}."
