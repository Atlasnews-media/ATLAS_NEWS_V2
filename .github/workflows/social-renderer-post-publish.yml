name: Social Renderer — Post-publish (staged)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Published reading path under src/content/readings/"
        required: true
        type: string
        default: "src/content/readings/2026-09-04-reading-activo-seguro-riesgo.md"
      publication_confirmed:
        description: "Confirm Atlas News is already published before rendering social assets"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - integration/social-renderer-post-publish
    paths:
      - "tools/social-renderer/**"
      - ".github/workflows/social-renderer-post-publish.yml"

permissions:
  contents: read

concurrency:
  group: social-renderer-post-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name == 'push' || inputs.publication_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOCIAL_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'src/content/readings/2026-09-04-reading-activo-seguro-riesgo.md' }}
      SOCIAL_PUBLICATION_CONFIRMED: "true"
    steps:
      - name: Checkout staged integration branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Restore renderer dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: tools/social-renderer/node_modules
          key: ${{ runner.os }}-node-22.19-social-renderer-${{ hashFiles('tools/social-renderer/package.json') }}

      - name: Restore Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-social-renderer-playwright-1.62.1

      - name: Install isolated renderer dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: tools/social-renderer
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Ensure Chromium
        working-directory: tools/social-renderer
        run: npx playwright install chromium

      - name: Render only after publication confirmation
        working-directory: tools/social-renderer
        run: npm run render

      - name: Upload social artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atlas-news-social-renderer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/social-renderer/output/*.png
            tools/social-renderer/output/benchmark.json
          if-no-files-found: error
          retention-days: 7
