name: Formatear corrección del mercado
on:
  push:
    branches:
      - fix/market-integrity-session-20261022
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/market-integrity-session-20261022
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar formato técnico a los archivos modificados
        run: |
          npx prettier --write public/js/market-data-policy.mjs public/js/market-live.js scripts/enrich-economic-trends.mjs scripts/lib/economic-variation.mjs scripts/recover-market-snapshot.mjs scripts/update-market-pulse.mjs
      - name: Guardar formato en rama técnica
        run: |
          git config user.name "ATLAS NEWS Format Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/js/market-data-policy.mjs public/js/market-live.js scripts/enrich-economic-trends.mjs scripts/lib/economic-variation.mjs scripts/recover-market-snapshot.mjs scripts/update-market-pulse.mjs
          if git diff --cached --quiet; then
            echo "Formato ya correcto"
          else
            git commit -m "style(market): format PR code with project Prettier"
            git push origin HEAD:fix/market-integrity-session-20261022
          fi
