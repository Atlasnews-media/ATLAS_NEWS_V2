name: TEMP — Format economic indicators

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-economic-indicators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply canonical Prettier format
        run: npx prettier --write src/components/EconomicIndicators.astro
      - name: Commit canonical format
        run: |
          if git diff --quiet -- src/components/EconomicIndicators.astro; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EconomicIndicators.astro
          git commit -m "style(indicators): apply canonical formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
