name: LAB TEMP — Formato prosodia semántica

on:
  pull_request:
    branches: [main]
    paths:
      - "lab-site/src/pages/audio-alexc-semantic-prosody-v1.astro"
      - "lab-site/src/pages/index.astro"
      - ".github/workflows/lab-temp-format-semantic.yml"

permissions:
  contents: read

jobs:
  format-probe:
    name: Obtener formato canónico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Formatear e imprimir
        run: |
          set -euo pipefail
          npx prettier --write \
            "lab-site/src/pages/audio-alexc-semantic-prosody-v1.astro" \
            "lab-site/src/pages/index.astro" \
            --ignore-path /dev/null
          echo "__ATLAS_PAGE_START__"
          cat "lab-site/src/pages/audio-alexc-semantic-prosody-v1.astro"
          echo "__ATLAS_PAGE_END__"
          echo "__ATLAS_INDEX_START__"
          cat "lab-site/src/pages/index.astro"
          echo "__ATLAS_INDEX_END__"
