name: LAB — audio profundo A/B

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha de inputs LAB (AAAA-MM-DD); vacío usa la más reciente"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deep-audio-lab:
    name: Generar Nacional + Mercados y medir
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio privado
        uses: actions/checkout@v5

      - name: Iniciar reloj LAB
        run: echo "ATLAS_LAB_RUN_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Preparar diálogo estructurado
        id: dialogue_plan
        env:
          ATLAS_LAB_EXP2_DATE: ${{ inputs.date }}
          ATLAS_LAB_EXP2_PLAN: ${{ runner.temp }}/atlas-lab-exp2-plan.json
        run: node scripts/lab-prepare-deep-dialogue.mjs

      - name: Preparar acceso al repositorio público
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Descargar repositorio público
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          git clone --depth 1 git@github.com:EldeSiempre100/EldeSiempre100.github.io.git \
            "$RUNNER_TEMP/atlas-news-public"

      - name: Restaurar caché de Kokoro
        id: kokoro_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-${{ runner.os }}

      - name: Preparar entorno de síntesis y medir setup
        run: |
          set -euo pipefail
          start_ms=$(date +%s%3N)
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/kokoro-exp2-venv"
          source "$RUNNER_TEMP/kokoro-exp2-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy
          end_ms=$(date +%s%3N)
          setup_ms=$((end_ms - start_ms))
          setup_seconds=$(awk "BEGIN {printf \"%.3f\", $setup_ms/1000}")
          echo "ATLAS_LAB_SETUP_SECONDS=$setup_seconds" >> "$GITHUB_ENV"

      - name: Generar diálogos con Kokoro
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ runner.temp }}/atlas-news-public
          ATLAS_LAB_EXP2_PLAN: ${{ runner.temp }}/atlas-lab-exp2-plan.json
          ATLAS_LAB_KOKORO_CACHE_HIT: ${{ steps.kokoro_cache.outputs.cache-hit }}
          ATLAS_LAB_AUDIO_SPEED: "1.0"
          ATLAS_LAB_TURN_PAUSE_SECONDS: "0.34"
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/kokoro-exp2-venv/bin/activate"
          python scripts/lab-generate-deep-audio.py

      - name: Publicar audio LAB y medir push real
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atlas-news-public"
          git config user.name "ATLAS NEWS LAB"
          git config user.email "actions@users.noreply.github.com"
          git add lab/audio/exp2-national.mp3 lab/audio/exp2-markets.mp3 lab/audio/exp2-benchmark.json
          git commit -m "LAB exp2 — conversación profunda ${{ steps.dialogue_plan.outputs.exp2_date }}"

          publish_start_ms=$(date +%s%3N)
          git pull --rebase origin main
          git push origin main
          publish_end_ms=$(date +%s%3N)

          publish_ms=$((publish_end_ms - publish_start_ms))
          publish_seconds=$(awk "BEGIN {printf \"%.3f\", $publish_ms/1000}")
          total_ms=$((publish_end_ms - ATLAS_LAB_RUN_START_MS))
          total_seconds=$(awk "BEGIN {printf \"%.3f\", $total_ms/1000}")

          tmp=$(mktemp)
          jq \
            --argjson publish "$publish_seconds" \
            --argjson total "$total_seconds" \
            '.publishSeconds=$publish | .totalSeconds=$total | .status="published" | .benchmarkFinalizationExcluded=true' \
            lab/audio/exp2-benchmark.json > "$tmp"
          mv "$tmp" lab/audio/exp2-benchmark.json

          git add lab/audio/exp2-benchmark.json
          git commit -m "LAB exp2 — benchmark final ${{ steps.dialogue_plan.outputs.exp2_date }}"
          git pull --rebase origin main
          git push origin main

          echo "LAB exp2 publicado. Tiempo hasta primer push: ${total_seconds}s; push de audio: ${publish_seconds}s."
