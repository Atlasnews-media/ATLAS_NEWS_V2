name: Audio Speech V5 — promoción controlada

on:
  push:
    branches: [feat/audio-speech-v5]
    paths:
      - ".github/workflows/audio-speech-v5-promote.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/audio-speech-v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Aplicar Speech Normalizer V5
        run: |
          python3 - <<'PY'
          from pathlib import Path

          speech = Path('scripts/audio_speech.py')
          text = speech.read_text(encoding='utf-8')
          text = text.replace('SPEECH_NORMALIZER_VERSION = 4', 'SPEECH_NORMALIZER_VERSION = 5')
          anchor = '''def normalize_public_section_names(text: str) -> str:\n'''
          block = '''def normalize_financial_spoken_form(text: str) -> str:\n    """Adapta anglicismos financieros al español hablado sin tocar display_text."""\n    normalized = str(text)\n\n    contextual_rules = (\n        (\n            r"\\brepricing\\s+de\\s+tasas\\b",\n            "reajuste de expectativas sobre las tasas",\n        ),\n        (\n            r"\\brepricing\\s+de\\s+duraci[oó]n\\b",\n            "reajuste de precios en activos de larga duración",\n        ),\n        (\n            r"\\bcross[- ]asset\\b",\n            "entre distintas clases de activos",\n        ),\n    )\n    for pattern, replacement in contextual_rules:\n        normalized = re.sub(pattern, replacement, normalized, flags=re.IGNORECASE)\n\n    article_rules = (\n        (r"\\b(el|un|este|ese)\\s+repricing\\b", r"\\1 reajuste de expectativas"),\n        (\n            r"\\b(la|una|esta|esa)\\s+repricing\\b",\n            r"\\1 revisión de expectativas",\n        ),\n    )\n    for pattern, replacement in article_rules:\n        normalized = re.sub(pattern, replacement, normalized, flags=re.IGNORECASE)\n\n    normalized = re.sub(\n        r"\\brepricing\\b",\n        "reajuste de expectativas",\n        normalized,\n        flags=re.IGNORECASE,\n    )\n    return normalized\n\n\n'''
          if 'def normalize_financial_spoken_form' not in text:
              text = text.replace(anchor, block + anchor)
          old = '''    normalized = normalize_public_section_names(normalized)\n    normalized = normalize_relative_days(normalized, reference_date)\n'''
          new = '''    normalized = normalize_public_section_names(normalized)\n    normalized = normalize_financial_spoken_form(normalized)\n    normalized = normalize_relative_days(normalized, reference_date)\n'''
          if old not in text:
              raise SystemExit('No se encontró el punto de inserción de V5 en normalize_for_speech')
          text = text.replace(old, new)
          speech.write_text(text, encoding='utf-8')

          tests = Path('scripts/test_audio_speech.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace('SPEECH_NORMALIZER_VERSION != 4', 'SPEECH_NORMALIZER_VERSION != 5')
          text = text.replace('El normalizador numérico debe publicar versión 4.', 'Speech Normalizer debe publicar versión 5.')
          marker = '''check("Powell habló en Wall Street.", "Páuel habló en Uól Strít.")\n'''
          v5_tests = '''# Golden tests Speech V5: verbalización financiera controlada.\ncheck(\n    "El IPC decidirá si esa repricing se consolida.",\n    "El índice de precios al consumidor decidirá si esa revisión de expectativas se consolida.",\n)\ncheck(\n    "Si el repricing de tasas continúa, los rendimientos largos seguirán bajo presión.",\n    "Si el reajuste de expectativas sobre las tasas continúa, los rendimientos largos seguirán bajo presión.",\n)\ncheck(\n    "La repricing de duración puede amplificarse.",\n    "La revisión de expectativas de larga duración puede amplificarse.",\n)\ncheck(\n    "El endurecimiento cross-asset refleja mayor prima por riesgo.",\n    "El endurecimiento entre distintas clases de activos refleja mayor prima por riesgo.",\n)\n\n'''
          if 'Golden tests Speech V5' not in text:
              text = text.replace(marker, marker + v5_tests)
          text = text.replace('print("Audio speech V4: golden tests OK")', 'print("Audio speech V5: golden tests OK")')
          tests.write_text(text, encoding='utf-8')

          planner = Path('scripts/prepare-audio-v2.mjs')
          text = planner.read_text(encoding='utf-8')
          text = text.replace('const SPEECH_NORMALIZER_VERSION = 4;', 'const SPEECH_NORMALIZER_VERSION = 5;')
          old = '''    sameHash &&\n    sameLexicon(existing) &&\n    hasPublishedPath;\n'''
          new = '''    sameHash &&\n    existing?.speechNormalizerVersion === SPEECH_NORMALIZER_VERSION &&\n    sameLexicon(existing) &&\n    hasPublishedPath;\n'''
          if old not in text:
              raise SystemExit('No se encontró guard de currentAnalysisState')
          text = text.replace(old, new)
          old = '''  needsGeneration: Boolean(coverPlan.needsGeneration || !coverLexiconCurrent),\n'''
          new = '''  needsGeneration: Boolean(\n    coverPlan.needsGeneration ||\n      !coverLexiconCurrent ||\n      existingCover?.speechNormalizerVersion !== SPEECH_NORMALIZER_VERSION,\n  ),\n'''
          if old not in text:
              raise SystemExit('No se encontró guard de Portada')
          text = text.replace(old, new)
          planner.write_text(text, encoding='utf-8')

          daily = Path('scripts/prepare-daily-audio.mjs')
          text = daily.read_text(encoding='utf-8')
          text = text.replace('const SCRIPT_VERSION = 8;\n', 'const SCRIPT_VERSION = 8;\nconst SPEECH_NORMALIZER_VERSION = 5;\n')
          old = '''const sameSources =\n  existing?.scriptVersion === SCRIPT_VERSION &&\n  existing?.date === date &&\n'''
          new = '''const sameSources =\n  existing?.scriptVersion === SCRIPT_VERSION &&\n  existing?.speechNormalizerVersion === SPEECH_NORMALIZER_VERSION &&\n  existing?.date === date &&\n'''
          if old not in text:
              raise SystemExit('No se encontró sameSources de Portada')
          text = text.replace(old, new)
          daily.write_text(text, encoding='utf-8')
          PY

      - name: Formatear planners JS
        run: npx prettier --write scripts/prepare-audio-v2.mjs scripts/prepare-daily-audio.mjs
      - name: Ejecutar golden tests V5
        run: python3 scripts/test_audio_speech.py
      - name: Validar sintaxis planners
        run: |
          python3 -m py_compile scripts/audio_speech.py scripts/test_audio_speech.py
          node --check scripts/prepare-audio-v2.mjs
          node --check scripts/prepare-daily-audio.mjs
      - name: Guardar V5 en la rama
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Audio"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/audio_speech.py scripts/test_audio_speech.py scripts/prepare-audio-v2.mjs scripts/prepare-daily-audio.mjs
          git commit -m "Audio V2 — Speech Normalizer V5"
          git pull --rebase origin feat/audio-speech-v5
          git push origin HEAD:feat/audio-speech-v5
