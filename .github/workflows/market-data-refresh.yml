name: Actualizar datos de mercado

# Scheduler resync marker: 2026-09-16
on:
  schedule:
    - cron: "7,22,37,52 11-23 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/market-data-refresh.yml"

permissions:
  contents: read

concurrency:
  group: atlas-news-production
  cancel-in-progress: false

jobs:
  refresh-market-data:
    name: Refrescar y publicar datos vivos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar ATLAS NEWS V2
        uses: actions/checkout@v5

      - name: Autorizar disparo financiero desde main
        id: window
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error title=Origen financiero no autorizado::El refresh solo se ejecuta desde main." >&2
            exit 1
          fi

          case "${GITHUB_EVENT_NAME}" in
            schedule)
              echo "Agenda autorizada: una ejecución retrasada no debe descartarse por la hora del runner."
              ;;
            push)
              echo "Cambio validado en main: se actualizan los snapshots financieros."
              ;;
            workflow_dispatch)
              echo "Ejecución manual desde main: se actualizan los snapshots financieros."
              ;;
            *)
              echo "::error title=Evento no autorizado::Disparo financiero no admitido: ${GITHUB_EVENT_NAME}." >&2
              exit 1
              ;;
          esac

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Hora de ejecución Chile: $(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Preparar Node.js
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.window.outputs.run == 'true'
        run: npm ci

      - name: Actualizar corte de datos
        if: steps.window.outputs.run == 'true'
        run: npm run update:indicators

      - name: Validar contrato de datos sin construir páginas
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const market = JSON.parse(await readFile("public/data/market-pulse.json", "utf8"));
          const economic = JSON.parse(await readFile("public/data/economic-indicators.json", "utf8"));
          if (market.schemaVersion !== 1 || !Date.parse(market.generatedAt) || !Array.isArray(market.assets)) {
            throw new Error("Snapshot de mercado inválido.");
          }
          if (economic.schemaVersion !== 1 || !Array.isArray(economic.indicators)) {
            throw new Error("Snapshot económico inválido.");
          }
          const primary = ["ipsa", "sp500", "brent"];
          const found = primary.filter((id) => market.assets.some((item) => item.id === id));
          if (found.length === 0) throw new Error("Sin indicadores principales recuperables.");
          console.log(`Contrato de datos OK. Principales presentes: ${found.join(", ")}`);
          NODE

      - name: Preparar acceso al repositorio público
        if: steps.window.outputs.run == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Publicar solo snapshots financieros (sin rebuild editorial)
        if: steps.window.outputs.run == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        shell: bash
        run: |
          set -euo pipefail
          atlas_publish_dir="$RUNNER_TEMP/atlas-news-public"
          for attempt in 1 2 3; do
            rm -rf "$atlas_publish_dir"
            git clone --depth 1 git@github.com:Atlasnews-media/Atlasnews-media.github.io.git "$atlas_publish_dir"
            mkdir -p "$atlas_publish_dir/data"
            cp public/data/economic-indicators.json "$atlas_publish_dir/data/economic-indicators.json"
            cp public/data/market-pulse.json "$atlas_publish_dir/data/market-pulse.json"
            cd "$atlas_publish_dir"
            git config user.name "ATLAS NEWS Data Refresh"
            git config user.email "actions@users.noreply.github.com"
            git add -- data/economic-indicators.json data/market-pulse.json
            if git diff --cached --quiet; then
              echo "Los snapshots públicos ya coinciden con la captura."
              exit 0
            fi
            git commit -m "Actualiza snapshots financieros $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')"
            if git push origin main; then
              echo "Publicación atómica de snapshots completada."
              exit 0
            fi
            echo "Colisión de escritor público: conciliando contra HEAD remoto ($attempt/3)." >&2
            sleep 3
          done
          echo "No se pudo publicar el snapshot tras tres intentos." >&2
          exit 1

      - name: Verificar snapshot público publicado
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_cut="$(jq -r '.generatedAt // empty' public/data/market-pulse.json)"
          source_economic="$(jq -r '.fetchedAt // empty' public/data/economic-indicators.json)"
          if [[ -z "$source_cut" || -z "$source_economic" ]]; then
            echo "Faltan fechas de generación o captura." >&2
            exit 1
          fi
          for attempt in $(seq 1 40); do
            market_url="https://atlasnews-media.github.io/data/market-pulse.json?verify=${GITHUB_RUN_ID}-$attempt"
            economic_url="https://atlasnews-media.github.io/data/economic-indicators.json?verify=${GITHUB_RUN_ID}-$attempt"
            market_file="$RUNNER_TEMP/live-market.json"
            economic_file="$RUNNER_TEMP/live-economic.json"
            if curl -fsSL --max-time 10 "$market_url" -o "$market_file" &&
               curl -fsSL --max-time 10 "$economic_url" -o "$economic_file" &&
               jq -e --arg cut "$source_cut" '.generatedAt == $cut' "$market_file" >/dev/null &&
               jq -e --arg cut "$source_economic" '.fetchedAt == $cut' "$economic_file" >/dev/null; then
              echo "GitHub Pages confirma ambas capturas del corte $source_cut."
              exit 0
            fi
            echo "Esperando propagación pública del snapshot ($attempt/40)."
            sleep 7
          done
          echo "Error: GitHub Pages no confirmó los snapshots nuevos." >&2
          exit 1
