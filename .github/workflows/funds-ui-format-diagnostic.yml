name: Diagnóstico formato Fondos UI

on:
  pull_request:
    paths:
      - "src/components/FundsTable.astro"
      - ".github/workflows/funds-ui-format-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-diff:
    name: Mostrar diff de Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Mostrar formato esperado
        run: |
          npx prettier --write src/components/FundsTable.astro
          git diff -- src/components/FundsTable.astro
          test -z "$(git status --short -- src/components/FundsTable.astro)"
