name: LAB Audio — format Speech V5

on:
  push:
    branches: [lab/audio-speech-v5]
    paths:
      - ".github/workflows/lab-format-speech-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatear página LAB
        run: npx prettier --write src/pages/lab/audio-speech-v5.astro
      - name: Guardar formato
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS LAB"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/lab/audio-speech-v5.astro
          if git diff --cached --quiet; then
            echo "Sin cambios de formato."
            exit 0
          fi
          git commit -m "LAB Audio — aplicar Prettier a Speech V5 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
