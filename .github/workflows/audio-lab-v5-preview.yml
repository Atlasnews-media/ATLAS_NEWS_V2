name: LAB Audio — Speech Normalizer V5 preview

on:
  push:
    branches: [lab/audio-speech-v5]
    paths:
      - "scripts/audio_speech_lab_v5.py"
      - "scripts/test_audio_speech_lab_v5.py"
      - "scripts/generate-audio-lab-v5.py"
      - "lab/audio-v2/2026-09-11-spoken-form-v5-source.txt"
      - ".github/workflows/audio-lab-v5-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-news-audio-lab-v5
  cancel-in-progress: true

jobs:
  preview:
    name: Generar comparación audible V4 vs V5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar rama LAB
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validar reglas LAB V5
        run: python3 scripts/test_audio_speech_lab_v5.py

      - name: Restaurar caché de Kokoro
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-${{ runner.os }}

      - name: Preparar Kokoro
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/kokoro-lab-v5"
          source "$RUNNER_TEMP/kokoro-lab-v5/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy

      - name: Generar muestras comparables
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/kokoro-lab-v5/bin/activate"
          python scripts/generate-audio-lab-v5.py
          test -s public/lab/audio/speech-v5-current.mp3
          test -s public/lab/audio/speech-v5-proposed.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 public/lab/audio/speech-v5-current.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 public/lab/audio/speech-v5-proposed.mp3

      - name: Guardar preview en la rama LAB
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Audio LAB"
          git config user.email "actions@users.noreply.github.com"
          git add \
            public/lab/audio/speech-v5-current.mp3 \
            public/lab/audio/speech-v5-proposed.mp3 \
            lab/audio-v2/2026-09-11-speech-v5-preview.md

          if git diff --cached --quiet; then
            echo "Preview LAB sin cambios; se conserva el artefacto existente."
            exit 0
          fi

          git commit -m "LAB Audio — preview Kokoro Speech V5 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Adjuntar comparación
        uses: actions/upload-artifact@v4
        with:
          name: atlas-audio-speech-v5-preview
          path: |
            public/lab/audio/speech-v5-current.mp3
            public/lab/audio/speech-v5-proposed.mp3
            lab/audio-v2/2026-09-11-speech-v5-preview.md
          if-no-files-found: error
          retention-days: 7
