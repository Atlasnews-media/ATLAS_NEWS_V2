name: Formatear corrección de periodicidad
on:
  push:
    branches:
      - fix/market-refresh-reliability-20261022
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/market-refresh-reliability-20261022
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar Prettier a archivos modificados
        run: |
          npx prettier --write .github/workflows/market-data-refresh.yml .github/workflows/publish-site.yml src/components/EconomicIndicators.astro public/js/market-live.js scripts/update-economic-indicators.mjs scripts/update-market-pulse.mjs scripts/lib/reconcile-economic-indicators.mjs scripts/test-market-runtime.mjs
      - name: Guardar formato
        run: |
          git config user.name "ATLAS NEWS Format Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/market-data-refresh.yml .github/workflows/publish-site.yml src/components/EconomicIndicators.astro public/js/market-live.js scripts/update-economic-indicators.mjs scripts/update-market-pulse.mjs scripts/lib/reconcile-economic-indicators.mjs scripts/test-market-runtime.mjs
          if git diff --cached --quiet; then
            echo "Formato correcto"
          else
            git commit -m "style(market): format periodic-refresh fix"
            git push origin HEAD:fix/market-refresh-reliability-20261022
          fi
