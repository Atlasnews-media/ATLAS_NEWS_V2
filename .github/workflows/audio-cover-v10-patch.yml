name: Audio Portada V10 — patch helper

on:
  push:
    branches: [feat/audio-cover-v10-market-pulse]
    paths:
      - ".github/workflows/audio-cover-v10-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/audio-cover-v10-market-pulse
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrar pulso diario en Portada V10
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/prepare-daily-audio.mjs")
          text = path.read_text()

          replacements = {
              "const SCRIPT_VERSION = 9;": "const SCRIPT_VERSION = 10;",
              "const TARGET_MIN_WORDS = 260;": "const TARGET_MIN_WORDS = 340;",
              "const TARGET_MAX_WORDS = 340;": "const TARGET_MAX_WORDS = 440;",
              "// Portada V9 es un briefing transversal.": "// Portada V10 es un briefing transversal con pulso cuantitativo de mercados.",
              'summary: "Un briefing transversal de Internacional, Nacional y Mercados.",': 'summary: "Un briefing transversal de Internacional, Nacional y Mercados, con pulso cuantitativo de apertura.",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"No se encontró patrón esperado: {old}")
              text = text.replace(old, new, 1)

          marker = "const editions = await records(editionDir);"
          if marker not in text:
              raise SystemExit("No se encontró punto de inserción para market pulse")

          helpers = r'''function formatMarketNumber(value, maxDigits = 2) {
            return new Intl.NumberFormat("es-CL", {
              minimumFractionDigits: 0,
              maximumFractionDigits: maxDigits,
            }).format(Math.abs(Number(value)));
          }

          function marketMove(asset, { up, down }) {
            const change = Number(asset?.changePercent);
            if (!Number.isFinite(change)) return null;
            if (Math.abs(change) < 0.01) return "se mantiene sin cambios";
            return `${change > 0 ? up : down} ${formatMarketNumber(change)}%`;
          }

          function joinSpanish(items) {
            const values = items.filter(Boolean);
            if (values.length <= 1) return values[0] ?? "";
            if (values.length === 2) return `${values[0]} y ${values[1]}`;
            return `${values.slice(0, -1).join(", ")} y ${values.at(-1)}`;
          }

          function standoutLabel(id) {
            return {
              nasdaq: "el Nasdaq",
              dow: "el Dow Jones",
              stoxx50: "el Euro Stoxx 50",
              gold: "el oro",
              eurusd: "el euro frente al dólar",
              usdjpy: "el dólar frente al yen",
              bitcoin: "Bitcoin",
            }[id];
          }

          async function buildMarketPulseSpeech(publicDir) {
            if (!publicDir) return null;

            try {
              const snapshot = JSON.parse(
                await readFile(path.join(publicDir, "data", "market-pulse.json"), "utf8"),
              );
              const assets = (snapshot.assets ?? []).filter(
                (asset) => asset?.status === "current",
              );
              const byId = new Map(assets.map((asset) => [asset.id, asset]));
              const sentences = [];

              const dollarMove = marketMove(byId.get("usdclp"), {
                up: "sube",
                down: "baja",
              });
              if (dollarMove) {
                sentences.push(
                  `Con los últimos datos disponibles, el dólar ${dollarMove} frente al peso chileno.`,
                );
              } else {
                sentences.push("Con los últimos datos disponibles, revisamos el pulso de los mercados.");
              }

              const ipsaMove = marketMove(byId.get("ipsa"), {
                up: "avanza",
                down: "retrocede",
              });
              const spMove = marketMove(byId.get("sp500"), {
                up: "sube",
                down: "cae",
              });
              const brentMove = marketMove(byId.get("brent"), {
                up: "avanza",
                down: "retrocede",
              });
              const equityEnergy = [
                ipsaMove ? `el IPSA ${ipsaMove}` : null,
                spMove ? `el S&P 500 ${spMove}` : null,
                brentMove ? `el Brent ${brentMove}` : null,
              ];
              if (equityEnergy.some(Boolean)) {
                const joined = joinSpanish(equityEnergy);
                sentences.push(`${joined[0].toUpperCase()}${joined.slice(1)}.`);
              }

              const copperMove = marketMove(byId.get("copper"), {
                up: "sube",
                down: "baja",
              });
              if (copperMove) {
                sentences.push(`El cobre, en tanto, ${copperMove}.`);
              }

              const treasury = byId.get("ust10y");
              if (Number.isFinite(Number(treasury?.value))) {
                sentences.push(
                  `El Treasury de Estados Unidos a diez años se ubica en ${formatMarketNumber(treasury.value)}%.`,
                );
              }

              const standout = assets
                .filter((asset) =>
                  ["nasdaq", "dow", "stoxx50", "gold", "eurusd", "usdjpy", "bitcoin"].includes(
                    asset.id,
                  ),
                )
                .filter(
                  (asset) =>
                    Number.isFinite(Number(asset.changePercent)) &&
                    Math.abs(Number(asset.changePercent)) >= 1,
                )
                .sort(
                  (left, right) =>
                    Math.abs(Number(right.changePercent)) -
                    Math.abs(Number(left.changePercent)),
                )[0];

              if (standout) {
                const label = standoutLabel(standout.id);
                const move = marketMove(standout, {
                  up: "avanza",
                  down: "retrocede",
                });
                if (label && move) {
                  sentences.push(`Entre los movimientos destacados, ${label} ${move}.`);
                }
              }

              sentences.push(
                "Ese es el punto de partida de los mercados para esta jornada.",
              );
              return sentences.join(" ");
            } catch (error) {
              console.warn(
                `Pulso de mercados omitido: ${error?.message ?? String(error)}`,
              );
              return null;
            }
          }
'''
          text = text.replace(marker, f"{helpers}\n{marker}", 1)

          insertion = '''  { force: true },
          );

          const marketPulseSpeech = await buildMarketPulseSpeech(publicDir);
          if (marketPulseSpeech) {
            addSegment(parts, accepted, marketPulseSpeech, { force: true });
          }

          addContribution(
            parts,
            accepted,
            "La señal central.",'''
          target = '''  { force: true },
          );

          addContribution(
            parts,
            accepted,
            "La señal central.",'''
          if target not in text:
              raise SystemExit("No se encontró punto de inserción después de la apertura")
          text = text.replace(target, insertion, 1)

          path.write_text(text)
          PY
      - run: npx prettier --write scripts/prepare-daily-audio.mjs
      - name: Guardar V10
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Audio"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/prepare-daily-audio.mjs
          git commit -m "Audio Portada V10 — agrega pulso diario de mercados"
          git push origin HEAD:feat/audio-cover-v10-market-pulse
