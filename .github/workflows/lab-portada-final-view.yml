name: LAB Portada Final View

on:
  push:
    branches:
      - lab/portada-v2-final-view
    paths:
      - ".github/workflows/lab-portada-final-view.yml"

permissions:
  contents: write

jobs:
  apply-final-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lab/portada-v2-final-view
      - name: Limpiar chrome LAB y redundancia móvil
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/lab/portada-v2.astro")
          text = path.read_text()

          text = text.replace('''    <div class="lab-preview-bar">\n      <span>LAB · Preview Portada V2</span>\n      <a href="/lab/">Volver al LAB</a>\n    </div>\n\n''', '')

          text = text.replace('''  .lab-preview-bar {\n    display: flex;\n    justify-content: space-between;\n    gap: 1rem;\n    padding: 0.55rem 0;\n    color: var(--accent);\n    border-bottom: 1px solid var(--rule);\n    font: 800 0.64rem/1.2 var(--sans);\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n  }\n  .lab-preview-bar a {\n    color: inherit;\n    text-underline-offset: 0.2em;\n  }\n''', '')

          text = text.replace('''    .lab-preview-bar {\n      font-size: 0.58rem;\n    }\n    .issue-line {\n      grid-template-columns: 1fr auto;\n    }\n    .issue-line p:last-child {\n      display: none;\n    }\n''', '''    .issue-line {\n      display: none;\n    }\n''')

          path.write_text(text)
          PY
          npx prettier --write src/pages/lab/portada-v2.astro
      - name: Commit de vista final LAB
        run: |
          if git diff --quiet -- src/pages/lab/portada-v2.astro; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/lab/portada-v2.astro
          git commit -m "LAB: mostrar portada móvil V2 como producto final"
          git push origin HEAD:lab/portada-v2-final-view
