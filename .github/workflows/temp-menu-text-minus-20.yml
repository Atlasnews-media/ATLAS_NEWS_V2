name: TEMP — reducir texto menú 20%

on:
  push:
    branches:
      - style/menu-text-minus-20

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/menu-text-minus-20
          fetch-depth: 0

      - name: Reducir tipografía móvil del menú
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/SiteNavigation.astro')
          text = path.read_text()
          old = 'font-size: clamp(0.92rem, 4.65vw, 1.2rem);'
          new = 'font-size: clamp(0.74rem, 3.72vw, 0.96rem);'
          if text.count(old) != 1:
              raise SystemExit(f'Esperaba exactamente 1 coincidencia y encontré {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Verificar alcance
        run: git diff -- src/components/SiteNavigation.astro

      - name: Commit
        run: |
          git config user.name 'ATLAS NEWS UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/SiteNavigation.astro
          git commit -m 'style(navigation): reduce menu text 20 percent'
          git push origin HEAD:style/menu-text-minus-20
