name: Instagram Carousel — Controlled publish

on:
  workflow_dispatch:
    inputs:
      contract:
        description: "Path to an approved Social Content Contract v1 JSON"
        required: true
        type: string
      publication_status:
        description: "Type exactly: PUBLICACIÓN DISPONIBLE / VERIFICADA"
        required: true
        type: string
      publish_confirmation:
        description: "Type exactly: PUBLICAR CARRUSEL / AUTORIZADO"
        required: true
        type: string
      api_version:
        description: "Instagram Graph API version"
        required: true
        type: string
        default: "v23.0"

permissions:
  contents: read

concurrency:
  group: instagram-carousel-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOCIAL_CONTRACT: ${{ inputs.contract }}
      SOCIAL_PUBLICATION_STATUS: ${{ inputs.publication_status }}
      INSTAGRAM_PUBLISH_CONFIRMATION: ${{ inputs.publish_confirmation }}
      INSTAGRAM_API_VERSION: ${{ inputs.api_version }}
      INSTAGRAM_EXPECTED_USERNAME: _atlas_news
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - name: Verify explicit publication gates and secret presence
        shell: bash
        env:
          ATLAS_PAGES_DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test "$SOCIAL_PUBLICATION_STATUS" = "PUBLICACIÓN DISPONIBLE / VERIFICADA" || {
            echo "Fail-closed: Atlas News publication is not explicitly verified."
            exit 2
          }
          test "$INSTAGRAM_PUBLISH_CONFIRMATION" = "PUBLICAR CARRUSEL / AUTORIZADO" || {
            echo "Fail-closed: Instagram publication is not explicitly authorized."
            exit 3
          }
          test -n "$INSTAGRAM_ACCESS_TOKEN" || {
            echo "Fail-closed: INSTAGRAM_ACCESS_TOKEN repository secret is missing."
            exit 4
          }
          test -n "$ATLAS_PAGES_DEPLOY_KEY" || {
            echo "Fail-closed: ATLAS_PAGES_DEPLOY_KEY repository secret is missing."
            exit 5
          }

      - name: Checkout integration code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify explicit contract and published canonical URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOCIAL_CONTRACT" || {
            echo "Fail-closed: an approved contract path must be selected explicitly."
            exit 6
          }
          test -f "$SOCIAL_CONTRACT" || {
            echo "Fail-closed: contract does not exist: $SOCIAL_CONTRACT"
            exit 7
          }
          canonical_url="$(jq -er '.canonicalUrl | select(type == "string" and length > 0)' "$SOCIAL_CONTRACT")"
          case "$canonical_url" in
            https://*) ;;
            *)
              echo "Fail-closed: contract canonicalUrl must use HTTPS."
              exit 8
              ;;
          esac
          code="$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 2 --connect-timeout 10 --max-time 30 "$canonical_url" || true)"
          test "$code" = "200" || {
            echo "Fail-closed: canonicalUrl is not publicly reachable with HTTP 200."
            exit 9
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Restore renderer dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: tools/social-renderer/node_modules
          key: ${{ runner.os }}-node-22.19-social-renderer-${{ hashFiles('tools/social-renderer/package.json') }}

      - name: Restore Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-social-renderer-playwright-1.62.1

      - name: Install isolated renderer dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: tools/social-renderer
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Ensure Chromium
        working-directory: tools/social-renderer
        run: npx playwright install chromium

      - name: Render approved social contract
        working-directory: tools/social-renderer
        run: npm run render

      - name: Prepare access to public social host
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Checkout public social-assets host
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git clone --depth 1 --branch social-assets \
            git@github.com:EldeSiempre100/EldeSiempre100.github.io.git \
            _social_assets

      - name: Stage carousel images on public HTTPS URLs
        id: stage
        shell: bash
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          stage_dir="instagram-staging/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "_social_assets/$stage_dir"
          cp tools/social-renderer/output/atlas-news-instagram-carousel-0*.png "_social_assets/$stage_dir/"

          cd _social_assets
          git config user.name "ATLAS NEWS Social Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add "$stage_dir"
          git commit -m "social-assets: stage Instagram carousel ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:social-assets

          base_url="https://raw.githubusercontent.com/EldeSiempre100/EldeSiempre100.github.io/social-assets/${stage_dir}"
          echo "SOCIAL_IMAGE_BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "stage_dir=$stage_dir" >> "$GITHUB_OUTPUT"

      - name: Confirm staged images are publicly fetchable
        shell: bash
        run: |
          set -euo pipefail
          for n in 01 02 03 04 05; do
            url="$SOCIAL_IMAGE_BASE_URL/atlas-news-instagram-carousel-${n}.png"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -L -sS -o "/tmp/atlas-${n}.png" -w '%{http_code}' "$url" || true)"
              type="$(file -b --mime-type "/tmp/atlas-${n}.png" 2>/dev/null || true)"
              if [ "$code" = "200" ] && [ "$type" = "image/png" ]; then
                ok=1
                break
              fi
              sleep "$attempt"
            done
            test "$ok" = "1" || {
              echo "Public staging failed for $url"
              exit 10
            }
          done

      - name: Publish controlled Instagram carousel
        working-directory: tools/social-renderer
        run: npm run publish:instagram

      - name: Persist non-secret publication evidence
        if: always()
        shell: bash
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          evidence="tools/social-renderer/output/instagram-publish.json"
          if [ ! -f "$evidence" ]; then
            echo "No Instagram publication evidence file was produced."
            exit 0
          fi
          stage_dir="${{ steps.stage.outputs.stage_dir }}"
          test -n "$stage_dir" || {
            echo "No public staging directory exists; evidence remains in the Actions artifact only."
            exit 0
          }
          cp "$evidence" "_social_assets/$stage_dir/instagram-publish.json"
          cd _social_assets
          git add "$stage_dir/instagram-publish.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "social-assets: record Instagram publication ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:social-assets

      - name: Upload controlled-publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-news-instagram-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/social-renderer/output/*.png
            tools/social-renderer/output/benchmark.json
            tools/social-renderer/output/instagram-publish.json
          if-no-files-found: warn
          retention-days: 14
