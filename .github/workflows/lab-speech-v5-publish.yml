name: LAB Audio — publicar muestras Speech V5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lab-speech-v5-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio privado
        uses: actions/checkout@v5

      - name: Preparar acceso al repositorio público
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Descargar repositorio público
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          git clone --depth 1 git@github.com:EldeSiempre100/EldeSiempre100.github.io.git \
            "$RUNNER_TEMP/atlas-news-public"

      - name: Copiar muestras V4 y V5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-news-public/lab/audio"
          cp public/lab/audio/speech-v5-current.mp3 \
            "$RUNNER_TEMP/atlas-news-public/lab/audio/speech-v5-current.mp3"
          cp public/lab/audio/speech-v5-proposed.mp3 \
            "$RUNNER_TEMP/atlas-news-public/lab/audio/speech-v5-proposed.mp3"
          test -s "$RUNNER_TEMP/atlas-news-public/lab/audio/speech-v5-current.mp3"
          test -s "$RUNNER_TEMP/atlas-news-public/lab/audio/speech-v5-proposed.mp3"

      - name: Publicar muestras LAB
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atlas-news-public"
          git config user.name "ATLAS NEWS Audio LAB"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lab/audio/speech-v5-current.mp3 \
            lab/audio/speech-v5-proposed.mp3
          if git diff --cached --quiet; then
            echo "Las muestras V5 ya están publicadas."
            exit 0
          fi
          git commit -m "LAB Audio — muestras Speech V4 vs V5"
          git pull --rebase origin main
          git push origin main
