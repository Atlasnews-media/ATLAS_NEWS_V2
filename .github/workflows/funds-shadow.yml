name: Fondos BEAGF — sombra

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    name: Extraer y validar snapshot sin publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Probar subsistema Fondos
        run: npm run test:funds

      - name: Consultar BuscaFondos y generar snapshot sombra
        run: npm run funds:update -- --output .artifacts/funds/funds-beagf.json

      - name: Resumir snapshot validado
        run: |
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(".artifacts/funds/funds-beagf.json","utf8")); console.log(`Fondos=${p.funds.length} | datos=${p.asOf} | fuente=${p.source.name}`);'

      - name: Guardar snapshot como artefacto de prueba
        uses: actions/upload-artifact@v4
        with:
          name: funds-beagf-shadow
          path: .artifacts/funds/funds-beagf.json
          if-no-files-found: error
          retention-days: 7
