name: LAB Format Market Pulse

on:
  push:
    branches: [lab/market-pulse-data-v1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lab/market-pulse-data-v1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatear archivos del motor de mercados
        run: npx prettier --write scripts/update-market-pulse.mjs package.json
      - name: Guardar formato
        run: |
          if git diff --quiet; then
            echo "Sin cambios de formato."
            exit 0
          fi
          git config user.name "ATLAS NEWS Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/update-market-pulse.mjs package.json
          git commit -m "LAB market pulse — apply Prettier"
          git push origin HEAD:lab/market-pulse-data-v1
