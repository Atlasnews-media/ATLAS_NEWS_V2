name: TMP format economic

on:
  push:
    branches: [fix/portada-indicadores-retry]

permissions:
  contents: write

jobs:
  format-economic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/portada-indicadores-retry
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/EconomicIndicators.astro
      - name: Commit si hay cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios de formato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EconomicIndicators.astro
          git commit -m "Format: normalizar indicadores económicos"
          git push origin HEAD:fix/portada-indicadores-retry
