name: Audio Speech V5 — corregir género contextual

on:
  push:
    branches: [feat/audio-speech-v5]
    paths:
      - ".github/workflows/audio-speech-v5-grammar.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/audio-speech-v5
      - name: Corregir reglas contextuales V5
        run: |
          python3 - <<'PY'
          from pathlib import Path

          speech = Path('scripts/audio_speech.py')
          text = speech.read_text(encoding='utf-8')
          start = text.index('def normalize_financial_spoken_form')
          end = text.index('def normalize_public_section_names', start)
          replacement = '''def normalize_financial_spoken_form(text: str) -> str:\n    """Adapta términos financieros al español hablado sin tocar display_text."""\n    normalized = str(text)\n\n    article_context_rules = (\n        (\n            r"\\b(el|un|este|ese)\\s+repricing\\s+de\\s+tasas\\b",\n            r"\\1 reajuste de expectativas sobre las tasas",\n        ),\n        (\n            r"\\b(la|una|esta|esa)\\s+repricing\\s+de\\s+tasas\\b",\n            r"\\1 revisión de expectativas sobre las tasas",\n        ),\n        (\n            r"\\b(el|un|este|ese)\\s+repricing\\s+de\\s+duraci[oó]n\\b",\n            r"\\1 reajuste de expectativas de larga duración",\n        ),\n        (\n            r"\\b(la|una|esta|esa)\\s+repricing\\s+de\\s+duraci[oó]n\\b",\n            r"\\1 revisión de expectativas de larga duración",\n        ),\n    )\n    for pattern, replacement in article_context_rules:\n        normalized = re.sub(pattern, replacement, normalized, flags=re.IGNORECASE)\n\n    contextual_rules = (\n        (r"\\brepricing\\s+de\\s+tasas\\b", "reajuste de expectativas sobre las tasas"),\n        (\n            r"\\brepricing\\s+de\\s+duraci[oó]n\\b",\n            "reajuste de expectativas de larga duración",\n        ),\n        (r"\\bcross[- ]asset\\b", "entre distintas clases de activos"),\n    )\n    for pattern, replacement in contextual_rules:\n        normalized = re.sub(pattern, replacement, normalized, flags=re.IGNORECASE)\n\n    article_rules = (\n        (r"\\b(el|un|este|ese)\\s+repricing\\b", r"\\1 reajuste de expectativas"),\n        (r"\\b(la|una|esta|esa)\\s+repricing\\b", r"\\1 revisión de expectativas"),\n    )\n    for pattern, replacement in article_rules:\n        normalized = re.sub(pattern, replacement, normalized, flags=re.IGNORECASE)\n\n    return re.sub(\n        r"\\brepricing\\b",\n        "reajuste de expectativas",\n        normalized,\n        flags=re.IGNORECASE,\n    )\n\n\n'''
          text = text[:start] + replacement + text[end:]
          speech.write_text(text, encoding='utf-8')

          tests = Path('scripts/test_audio_speech.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '"La reajuste de expectativas de larga duración puede amplificarse.",',
              '"La revisión de expectativas de larga duración puede amplificarse.",',
          )
          anchor = '''check(\n    "Si el repricing de tasas continúa, los rendimientos largos seguirán bajo presión.",\n    "Si el reajuste de expectativas sobre las tasas continúa, los rendimientos largos seguirán bajo presión.",\n)\n'''
          extra = '''check(\n    "Si la repricing de tasas continúa, el mercado ajustará precios.",\n    "Si la revisión de expectativas sobre las tasas continúa, el mercado ajustará precios.",\n)\ncheck(\n    "Si el repricing de duración continúa, los bonos reaccionarán.",\n    "Si el reajuste de expectativas de larga duración continúa, los bonos reaccionarán.",\n)\n'''
          if 'Si la repricing de tasas continúa' not in text:
              text = text.replace(anchor, anchor + extra)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Validar V5
        run: |
          python3 scripts/test_audio_speech.py
          python3 -m py_compile scripts/audio_speech.py scripts/test_audio_speech.py
      - name: Guardar corrección
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Audio"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/audio_speech.py scripts/test_audio_speech.py
          git commit -m "Audio V2 — ajustar género en verbalización V5"
          git pull --rebase origin feat/audio-speech-v5
          git push origin HEAD:feat/audio-speech-v5
