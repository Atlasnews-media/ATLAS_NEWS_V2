name: Validar motor Fondos

on:
  pull_request:
    paths:
      - "src/lib/funds/**"
      - "scripts/funds/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/funds-unit-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-finance:
    name: Probar cálculos financieros
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato de Fondos
        run: npx prettier --check src/lib/funds/finance.ts scripts/funds/run-finance-tests.mjs scripts/funds/finance.test.cjs

      - name: Ejecutar pruebas de Fondos
        run: npm run test:funds
