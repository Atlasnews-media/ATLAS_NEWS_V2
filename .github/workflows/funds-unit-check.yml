name: Validar Fondos

on:
  pull_request:
    paths:
      - "src/lib/funds/**"
      - "scripts/funds/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/funds-unit-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-funds:
    name: Probar motor y snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Mostrar formato esperado
        run: |
          npx prettier --write scripts/funds/snapshot.mjs scripts/funds/update-funds.mjs
          git diff -- scripts/funds/snapshot.mjs scripts/funds/update-funds.mjs
          test -z "$(git status --short -- scripts/funds/snapshot.mjs scripts/funds/update-funds.mjs)"

      - name: Ejecutar pruebas de Fondos
        run: npm run test:funds
