name: Instagram Reel — Controlled recovery

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "sourceCommit de la edición a recuperar"
        required: true
        type: string
      confirmation:
        description: "Escribir exactamente: RECUPERAR REEL / AUTORIZADO"
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instagram-reel-publish-live-test.yml"
      - ".github/workflows/instagram-reel-publish-v2.yml"
      - ".github/workflows/reel-maker-v2.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: >-
    instagram-reel-recovery-${{
      github.event_name == 'workflow_dispatch' && inputs.source_commit ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar recovery controlado
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Verify recovery architecture
        run: |
          set -euo pipefail
          grep -q 'workflow_dispatch:' .github/workflows/instagram-reel-publish-v2.yml
          grep -q 'workflow_dispatch:' .github/workflows/reel-maker-v2.yml
          grep -q 'atlas-news-reel-canonical-' .github/workflows/instagram-reel-publish-v2.yml
          ! grep -q 'reel_maker.py' .github/workflows/instagram-reel-publish-live-test.yml
          ! grep -q 'prepare_reel_contract.py' .github/workflows/instagram-reel-publish-live-test.yml
          ! grep -q 'media_publish' .github/workflows/instagram-reel-publish-live-test.yml
          echo "PASS: controlled recovery only orchestrates canonical F4D/F4E workflows."

  recover:
    name: Recuperar Reel sin regeneración en F4E
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate explicit authorization and sourceCommit
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" = "RECUPERAR REEL / AUTORIZADO" ]] || {
            echo "Fail-closed: confirmation does not match required recovery authorization."
            exit 20
          }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Fail-closed: source_commit must be a full SHA."
            exit 21
          }
          git cat-file -e "${SOURCE_COMMIT}^{commit}" 2>/dev/null || git fetch --no-tags --depth=128 origin "$SOURCE_COMMIT"

      - name: Check durable Reel evidence first
        id: idem
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/Atlasnews-media/Atlasnews-media.github.io/social-assets/instagram-reels-published/${SOURCE_COMMIT}.json"
          body="$(mktemp)"
          code="$(curl -L -sS -o "$body" -w '%{http_code}' -H 'Cache-Control: no-cache' "${url}?recovery=${GITHUB_RUN_ID}" || true)"
          if [[ "$code" = "200" ]]; then
            jq -e --arg source "$SOURCE_COMMIT" '
              .sourceCommit == $source and
              (.mediaId | type == "string" and length > 0) and
              (.permalink | type == "string" and length > 0)
            ' "$body" >/dev/null || {
              echo "Fail-closed: durable evidence exists but is invalid."
              exit 22
            }
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            permalink="$(jq -r '.permalink' "$body")"
            echo "permalink=$permalink" >> "$GITHUB_OUTPUT"
          elif [[ "$code" = "404" ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Fail-closed: cannot determine durable idempotency (HTTP $code)."
            exit 23
          fi

      - name: Locate existing canonical F4D artifact
        if: steps.idem.outputs.already_published != 'true'
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="atlas-news-reel-canonical-${SOURCE_COMMIT}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          candidate="$(jq -c --arg name "$artifact_name" '
            [.artifacts[]
             | select(.expired == false and .name == $name)
             | select(.workflow_run.id != null)]
            | sort_by(.created_at)
            | reverse
            | .[0] // empty
          ' <<<"$artifacts")"
          if [[ -n "$candidate" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(jq -r '.id' <<<"$candidate")" >> "$GITHUB_OUTPUT"
            echo "run_id=$(jq -r '.workflow_run.id' <<<"$candidate")" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch canonical F4E when artifact exists
        if: steps.idem.outputs.already_published != 'true' && steps.artifact.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run instagram-reel-publish-v2.yml             --ref main             -f source_commit="$SOURCE_COMMIT"
          {
            echo "### Reel recovery — F4E dispatched"
            echo "sourceCommit: $SOURCE_COMMIT"
            echo "Existing canonical F4D artifact reused."
            echo "No Reel regeneration was performed by recovery."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch F4D backfill when artifact is unavailable or expired
        if: steps.idem.outputs.already_published != 'true' && steps.artifact.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run reel-maker-v2.yml             --ref main             -f source_commit="$SOURCE_COMMIT"
          {
            echo "### Reel recovery — F4D backfill dispatched"
            echo "sourceCommit: $SOURCE_COMMIT"
            echo "No valid canonical artifact was available."
            echo "Only F4D was asked to regenerate. Its SUCCESS will trigger canonical F4E automatically."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record already-published recovery no-op
        if: steps.idem.outputs.already_published == 'true'
        env:
          PERMALINK: ${{ steps.idem.outputs.permalink }}
        run: |
          {
            echo "### Reel recovery — ALREADY_PUBLISHED_VERIFIED"
            echo "sourceCommit: $SOURCE_COMMIT"
            echo "Permalink: $PERMALINK"
            echo "No F4D/F4E dispatch and no Meta POST were executed."
          } >> "$GITHUB_STEP_SUMMARY"
