name: LAB validate Signals

on:
  push:
    branches:
      - lab/senales-del-dia-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lab/senales-del-dia-v1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Actualizar datos como producción
        run: npm run update:indicators
      - name: Normalizar sólo datos vivos generados para aislar el gate de Señales
        run: npx prettier --write public/data/market-pulse.json src/data/market-pulse.json
      - name: Verificar formato y contratos existentes
        run: npm run format:check
      - name: Validar y construir sitio
        run: npm run build:site
