name: TEMP — Format Signals

on:
  push:
    branches:
      - fix/senales-detail-internacional-mercados-2026-09-24
    paths:
      - "src/components/SignalShareTools.astro"
      - "src/pages/internacional/[id].astro"
      - "src/pages/mercados/[id].astro"
      - ".github/workflows/tmp-format-signals.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write             src/components/SignalShareTools.astro             'src/pages/internacional/[id].astro'             'src/pages/mercados/[id].astro'
          git diff --             src/components/SignalShareTools.astro             'src/pages/internacional/[id].astro'             'src/pages/mercados/[id].astro'
