name: Audio Portada V9 — format helper

on:
  push:
    branches: [feat/audio-cover-v9-three-sources]
    paths:
      - ".github/workflows/audio-cover-v9-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/audio-cover-v9-three-sources
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/prepare-daily-audio.mjs
      - name: Guardar formato
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Audio"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/prepare-daily-audio.mjs
          if git diff --cached --quiet; then
            echo "Sin cambios de formato."
            exit 0
          fi
          git commit -m "Audio Portada V9 — aplicar formato"
          git pull --rebase origin feat/audio-cover-v9-three-sources
          git push origin HEAD:feat/audio-cover-v9-three-sources
