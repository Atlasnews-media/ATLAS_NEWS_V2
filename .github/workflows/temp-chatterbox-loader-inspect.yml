name: TEMP LAB — inspeccionar loader Chatterbox

on:
  push:
    branches: ["lab/alex-chatterbox-v1"]
    paths:
      - ".github/workflows/temp-chatterbox-loader-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clonar Space oficial
        run: |
          git clone --depth 1 https://huggingface.co/spaces/ResembleAI/Chatterbox-Multilingual-TTS-es-mx-latam "$RUNNER_TEMP/cb"
      - name: Mostrar dependencias y loader
        run: |
          echo "=== REQUIREMENTS ==="
          cat "$RUNNER_TEMP/cb/requirements.txt"
          echo "=== TTS loader signatures ==="
          grep -n -E "class ChatterboxTTS|def from_pretrained|REPO_ID|T3_FILENAME|hf_hub_download|snapshot_download" "$RUNNER_TEMP/cb/chatterbox/src/chatterbox/tts.py" || true
          echo "=== TTS relevant block ==="
          sed -n '1,240p' "$RUNNER_TEMP/cb/chatterbox/src/chatterbox/tts.py"
