name: TEMP LAB — Alex Chatterbox CPU

on:
  push:
    branches: ["lab/alex-chatterbox-v1"]
    paths:
      - "lab/audio-alex-chatterbox-v1/**"
      - ".github/workflows/temp-audio-alex-chatterbox-cpu.yml"

permissions:
  contents: read

concurrency:
  group: atlas-news-alex-chatterbox-cpu
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - name: Preparar sistema
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg python3-venv
          df -h /
          free -h

      - name: Preparar Python CPU
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar PyTorch CPU y dependencias
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu             torch==2.8.0 torchaudio==2.8.0
          python -m pip install --quiet             numpy==1.26.0             resampy==0.4.3             librosa==0.10.0             s3tokenizer             transformers==4.46.3             diffusers==0.29.0             omegaconf==2.3.0             resemble-perth==1.0.1             silero-vad==5.1.2             conformer==0.3.2             safetensors             huggingface_hub             soundfile             "kokoro==0.9.4"
          python -m pip check
          df -h /
          free -h

      - name: Fijar motores públicos
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/wlejon/kokoro-lab-py.git "$RUNNER_TEMP/kokoro-lab-py"
          cd "$RUNNER_TEMP/kokoro-lab-py"
          git checkout --quiet 9820dd38f40e71f8df318cdcf017bd24c62a03f7

          git clone --depth 1 --quiet             https://huggingface.co/spaces/ResembleAI/Chatterbox-Multilingual-TTS-es-mx-latam             "$RUNNER_TEMP/chatterbox-latam"

      - name: Generar comparación local
        env:
          KOKORO_LAB_PY: ${{ runner.temp }}/kokoro-lab-py
          CHATTERBOX_SPACE_DIR: ${{ runner.temp }}/chatterbox-latam
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: |
          set -euo pipefail
          python lab/audio-alex-chatterbox-v1/generate_lab.py
          df -h /
          free -h

      - name: Preparar acceso público
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Publicar sólo LAB
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git clone --depth 1 git@github.com:Atlasnews-media/Atlasnews-media.github.io.git "$RUNNER_TEMP/public"
          target="$RUNNER_TEMP/public/lab/audio/alex-chatterbox-v1"
          mkdir -p "$target"
          cp lab/audio-alex-chatterbox-v1/out/*.mp3 "$target/"
          cp lab/audio-alex-chatterbox-v1/out/manifest.json "$target/manifest.json"

          cat > "$target/index.html" <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <title>ATLAS NEWS LAB · Alex + Chatterbox LatAm</title>
            <style>
              :root{font-family:Georgia,serif;color:#171717;background:#f2efe5}
              *{box-sizing:border-box}body{margin:0}
              main{width:min(1120px,calc(100% - 32px));margin:auto;padding:60px 0}
              .k{font:800 12px/1.2 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
              h1{font-size:clamp(42px,8vw,82px);line-height:.94;margin:12px 0 18px}
              h2{font-size:25px;margin:8px 0 12px}
              p{line-height:1.55}.lead{max-width:800px;font-size:18px}
              .rule{border-top:1px solid;border-bottom:1px solid;height:5px;margin:34px 0}
              .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
              article{border:1px solid;padding:20px;background:rgba(255,255,255,.18)}
              article.candidate{border-top:5px solid #a71920}
              audio{width:100%;margin-top:12px}
              .note{font-size:14px;margin-top:28px}
              @media(max-width:760px){.grid{grid-template-columns:1fr}}
            </style>
          </head>
          <body>
          <main>
            <p class="k">ATLAS NEWS · AUDIO LAB</p>
            <h1>Alex · Chatterbox LatAm</h1>
            <p class="lead">Mismo texto en cuatro tratamientos. C y D usan el checkpoint oficial Chatterbox V3 LatAm ejecutado directamente en CPU, con Alex B2 como referencia vocal.</p>
            <div class="rule"></div>
            <div class="grid">
              <article>
                <p class="k">A · Control</p>
                <h2>Alex actual</h2>
                <p>Kokoro em_alex sin tratamiento B2.</p>
                <audio controls preload="metadata" src="./a-alex-current.mp3"></audio>
              </article>
              <article>
                <p class="k">B · Control</p>
                <h2>Alex B2</h2>
                <p>Mismo texto con el perfil broadcast que funcionó bien en diálogo.</p>
                <audio controls preload="metadata" src="./b-alex-b2.mp3"></audio>
              </article>
              <article class="candidate">
                <p class="k">C · Chatterbox</p>
                <h2>LatAm neutral</h2>
                <p>Clonado desde Alex B2 con expresividad y CFG neutrales.</p>
                <audio controls preload="metadata" src="./c-chatterbox-neutral.mp3"></audio>
              </article>
              <article class="candidate">
                <p class="k">D · Chatterbox</p>
                <h2>LatAm narrador</h2>
                <p>La misma referencia, con expresividad contenida y CFG menor para buscar un relato más humano.</p>
                <audio controls preload="metadata" src="./d-chatterbox-narrator.mp3"></audio>
              </article>
            </div>
            <p class="note"><strong>Guardrail:</strong> LAB aislado. No modifica F4B, Kokoro productivo, Speech Normalizer, Lexicon ni manifests.</p>
          </main>
          </body>
          </html>
          HTML

          cd "$RUNNER_TEMP/public"
          git config user.name "ATLAS NEWS AUDIO LAB"
          git config user.email "actions@users.noreply.github.com"
          git add lab/audio/alex-chatterbox-v1/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "LAB Audio — Alex Chatterbox LatAm CPU"
          git pull --rebase origin main
          git push origin main

      - name: Diagnóstico final
        if: always()
        run: |
          df -h / || true
          free -h || true
