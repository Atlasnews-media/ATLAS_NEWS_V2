name: LAB TEMP — Formato Astro acentuación

on:
  pull_request:
    branches: [main]
    paths:
      - "lab-site/src/pages/audio-alexc-accent-cfg-v1.astro"
      - ".github/workflows/lab-temp-format-alexc.yml"

permissions:
  contents: read

jobs:
  format-probe:
    name: Obtener formato canónico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formatear e imprimir
        run: |
          set -euo pipefail
          npx prettier --write "lab-site/src/pages/audio-alexc-accent-cfg-v1.astro" --ignore-path /dev/null
          echo "__ATLAS_FORMATTED_START__"
          cat "lab-site/src/pages/audio-alexc-accent-cfg-v1.astro"
          echo "__ATLAS_FORMATTED_END__"
