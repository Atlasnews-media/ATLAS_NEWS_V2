name: Format Cover V12

on:
  push:
    branches:
      - feat/audio-cover-v12-editorial-contract

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/audio-cover-v12-editorial-contract
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatear archivos V12
        run: |
          npx prettier --write \
            scripts/cover-briefing-contract.mjs \
            scripts/prepare-daily-audio.mjs \
            scripts/test-cover-briefing-contract.mjs
          rm .github/workflows/format-cover-v12.yml

      - name: Guardar formato y retirar helper temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cover-briefing-contract.mjs scripts/prepare-daily-audio.mjs scripts/test-cover-briefing-contract.mjs .github/workflows/format-cover-v12.yml
          git commit -m "chore: aplicar Prettier a Portada V12"
          git push origin HEAD:feat/audio-cover-v12-editorial-contract
