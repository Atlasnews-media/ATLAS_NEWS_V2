name: Aplicar parche aislamiento Fondos

on:
  pull_request:
    paths:
      - ".github/workflows/funds-phase6-patch-diagnostic.yml"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: Proteger snapshot frente al deploy editorial
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Descargar rama de trabajo
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Añadir exclusión del snapshot Fondos
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/publish-site.yml')
          text = path.read_text(encoding='utf-8')
          old = "rsync -a --delete --exclude='.git' --exclude='audio/' dist/ \"$atlas_publish_dir/\""
          new = "rsync -a --delete --exclude='.git' --exclude='audio/' --exclude='data/funds-beagf.json' dist/ \"$atlas_publish_dir/\""

          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit(f'Se esperaba exactamente una línea rsync objetivo; encontradas: {text.count(old)}')

          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Comprobar y guardar cambio acotado
        run: |
          set -euo pipefail
          git diff --check
          git diff -- .github/workflows/publish-site.yml

          if git diff --quiet -- .github/workflows/publish-site.yml; then
            echo "El deploy editorial ya protege el snapshot de Fondos."
            exit 0
          fi

          git config user.name "ATLAS NEWS Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/publish-site.yml
          git commit -m "fondos: preserva snapshot en despliegues editoriales"
          git push origin "HEAD:${TARGET_BRANCH}"
