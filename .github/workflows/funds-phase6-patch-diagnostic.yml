name: Preparar parche aislamiento Fondos

on:
  pull_request:
    paths:
      - ".github/workflows/funds-phase6-patch-diagnostic.yml"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    name: Generar publish-site protegido
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Añadir exclusión del snapshot Fondos
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/publish-site.yml')
          text = path.read_text(encoding='utf-8')
          old = "rsync -a --delete --exclude='.git' --exclude='audio/' dist/ \"$atlas_publish_dir/\""
          new = "rsync -a --delete --exclude='.git' --exclude='audio/' --exclude='data/funds-beagf.json' dist/ \"$atlas_publish_dir/\""

          if text.count(old) != 1:
              raise SystemExit(f'Se esperaba exactamente una línea rsync objetivo; encontradas: {text.count(old)}')

          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Comprobar cambio acotado
        run: |
          git diff --check
          git diff -- .github/workflows/publish-site.yml

      - name: Guardar archivo parcheado
        uses: actions/upload-artifact@v4
        with:
          name: publish-site-protected
          path: .github/workflows/publish-site.yml
          if-no-files-found: error
          retention-days: 1
