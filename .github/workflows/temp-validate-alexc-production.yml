name: TEMP VALIDATE — Alex C production

on:
  push:
    branches: ["audio/alexc-production-v1"]
    paths:
      - "config/audio/alex-c-v1.json"
      - "scripts/audio_alexc.py"
      - "scripts/audio_speech.py"
      - "scripts/test_audio_speech.py"
      - "scripts/prepare-audio-v2.mjs"
      - "scripts/generate-audio-v2.py"
      - ".github/workflows/audio-v2.yml"
      - ".github/workflows/temp-validate-alexc-production.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ATLAS_SOURCE_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Golden tests Speech
        run: python scripts/test_audio_speech.py

      - name: Preparar runtime CPU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install --quiet "kokoro==0.9.4" numpy==1.26.0 soundfile resampy==0.4.3 librosa==0.10.0 s3tokenizer transformers==4.46.3 diffusers==0.29.0 omegaconf==2.3.0 resemble-perth==1.0.1 silero-vad==5.1.2 conformer==0.3.2 safetensors huggingface_hub

          git clone --quiet https://huggingface.co/spaces/ResembleAI/Chatterbox-Multilingual-TTS-es-mx-latam "$RUNNER_TEMP/chatterbox-latam"
          git -C "$RUNNER_TEMP/chatterbox-latam" checkout --quiet 0d2648c4c1637eccfa8d45c7e192a0ad8d5b1fca

          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from huggingface_hub import snapshot_download

          base = Path(snapshot_download(
              repo_id="ResembleAI/chatterbox",
              revision="5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18",
              allow_patterns=["ve.pt", "grapheme_mtl_merged_expanded_v1.json", "conds.pt"],
          ))
          latam = Path(snapshot_download(
              repo_id="ResembleAI/Chatterbox-Multilingual-es-mx-latam",
              revision="27e595bf2fe7be0533ca299d9afafcde08b7cca7",
              allow_patterns=["t3_es_mx_latam.safetensors", "s3gen_v3.pt"],
          ))
          target = Path(os.environ["RUNNER_TEMP"]) / "chatterbox-ckpt"
          target.mkdir(parents=True, exist_ok=True)
          for name in ("ve.pt", "grapheme_mtl_merged_expanded_v1.json", "conds.pt"):
              shutil.copy2(base / name, target / name)
          for name in ("t3_es_mx_latam.safetensors", "s3gen_v3.pt"):
              shutil.copy2(latam / name, target / name)
          PY

      - name: Preparar acceso público
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/atlas_news_pages
          chmod 600 ~/.ssh/atlas_news_pages
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/atlas_news_pages -o IdentitiesOnly=yes"             git clone --depth 1 git@github.com:Atlasnews-media/Atlasnews-media.github.io.git "$RUNNER_TEMP/public"

      - name: Construir plan real
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ runner.temp }}/public
          ATLAS_AUDIO_PLAN: ${{ runner.temp }}/cover-plan.json
          ATLAS_AUDIO_VOICE: ef_dora
          ATLAS_AUDIO_OWNER: audio-v2
        run: |
          node scripts/prepare-daily-audio.mjs
          ATLAS_INTERNATIONAL_PLAN="$RUNNER_TEMP/international-plan.json" node scripts/prepare-international-audio.mjs
          ATLAS_PUBLIC_REPO_DIR="$RUNNER_TEMP/public"           ATLAS_COVER_PLAN="$RUNNER_TEMP/cover-plan.json"           ATLAS_INTERNATIONAL_PLAN="$RUNNER_TEMP/international-plan.json"           ATLAS_AUDIO_V2_PLAN="$RUNNER_TEMP/audio-plan.json"             node scripts/prepare-audio-v2.mjs
          cat "$RUNNER_TEMP/audio-plan.json"

      - name: Generar sin publicar
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ runner.temp }}/public
          ATLAS_AUDIO_V2_PLAN: ${{ runner.temp }}/audio-plan.json
          ATLAS_AUDIO_SPEED: "1.0"
          ATLAS_CHATTERBOX_SPACE_DIR: ${{ runner.temp }}/chatterbox-latam
          ATLAS_CHATTERBOX_CKPT_DIR: ${{ runner.temp }}/chatterbox-ckpt
        run: |
          set -euo pipefail
          python scripts/generate-audio-v2.py

      - name: Verificar Alex C en los tres productos
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/public/audio/analysis-latest.json"
          jq -e '
            .voiceProfileTarget == "alex-c-v1" and
            [.international, .national, .markets] |
            all(
              .status == "published" and
              .voiceProfileVersion == "alex-c-v1" and
              .fallbackUsed == false
            )
          ' "$manifest"
          jq '{
            international: {engine, voiceProfileVersion, fallbackUsed, durationSeconds} = .international,
            national: {engine, voiceProfileVersion, fallbackUsed, durationSeconds} = .national,
            markets: {engine, voiceProfileVersion, fallbackUsed, durationSeconds} = .markets
          }' "$manifest"
