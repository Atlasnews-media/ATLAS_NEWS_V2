name: Carousel Template Preview — isolated artifact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/carousel-template-preview.yml"
      - ".github/workflows/instagram-carousel-publish-automatic.yml"
      - "tools/carousel/**"
      - "tools/social-renderer/render.mjs"
      - "tools/social-renderer/resolve-instagram-session.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOCIAL_PUBLICATION_STATUS: PUBLICACIÓN DISPONIBLE / VERIFICADA
      SOCIAL_EDITION_NUMBER: "046"
      INSTAGRAM_API_VERSION: v23.0
      INSTAGRAM_EXPECTED_USERNAME: _atlas_news

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0

      - name: Syntax-check carousel contract and publisher
        run: |
          node --check tools/carousel/prepare-carousel-contract.mjs
          node --check tools/carousel/publish-instagram.mjs

      - name: Install Carousel V2 dependencies
        working-directory: tools/carousel
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install preserved SHARE renderer dependencies
        working-directory: tools/social-renderer
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Ensure Chromium
        working-directory: tools/carousel
        run: npx playwright install chromium

      - name: Verify five official bases
        working-directory: tools/carousel
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5; do
            test -f "assets/CARRUSEL_${n}.png"
          done

      - name: Render five-slide carousel fixture
        working-directory: tools/carousel
        env:
          SOCIAL_CONTRACT: tools/carousel/contracts/example-v1.json
        run: node carousel-renderer.mjs

      - name: Validate five-slide artifact
        working-directory: tools/carousel
        run: |
          set -euo pipefail
          test "$(find output -maxdepth 1 -type f -name 'atlas-news-instagram-carousel-0*.png' | wc -l | tr -d ' ')" = "5"
          for n in 01 02 03 04 05; do
            test -f "output/atlas-news-instagram-carousel-${n}.png"
          done
          jq -e '
            .status == "PASS" and
            .carouselSlides == 5 and
            .editionNumber == "046" and
            .uniqueVisuals == 5 and
            (.outputs | length == 5) and
            (.templates | length == 5)
          ' output/template-validation.json >/dev/null

      - name: Render preserved SHARE card from same contract
        working-directory: tools/social-renderer
        env:
          SOCIAL_CONTRACT: tools/carousel/contracts/example-v1.json
        run: |
          node render.mjs
          test -f output/atlas-news-social-card-1200x630.png

      - name: Resolve Instagram session exactly like production
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$INSTAGRAM_ACCESS_TOKEN" || {
            echo "BLOCKED_EXTERNAL: INSTAGRAM_ACCESS_TOKEN is missing."
            exit 4
          }
          node tools/social-renderer/resolve-instagram-session.mjs

      - name: Verify resolved Instagram account without publishing
        run: |
          set -euo pipefail
          test "$INSTAGRAM_USERNAME" = "$INSTAGRAM_EXPECTED_USERNAME" || {
            echo "BLOCKED_EXTERNAL: wrong Instagram account ${INSTAGRAM_USERNAME:-<missing>}."
            exit 6
          }
          response="$(curl -fsSL             -H "Authorization: Bearer ${INSTAGRAM_SESSION_TOKEN}"             -H 'User-Agent: ATLAS-NEWS-Social-DryRun/3.0'             "${INSTAGRAM_GRAPH_BASE}/${INSTAGRAM_USER_ID}?fields=id,username")" || {
              echo "BLOCKED_EXTERNAL: resolved Instagram session rejected by read-only account lookup."
              exit 7
            }
          jq -e --arg id "$INSTAGRAM_USER_ID" --arg username "$INSTAGRAM_EXPECTED_USERNAME" '
            (.id | tostring) == $id and (.username | ascii_downcase) == ($username | ascii_downcase)
          ' <<<"$response" >/dev/null
          echo "Instagram session accepted for @_atlas_news. No POST request was sent to Meta."

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-news-carousel-five-dry-run-${{ github.run_id }}
          path: |
            tools/carousel/contracts/example-v1.json
            tools/carousel/output/atlas-news-instagram-carousel-0*.png
            tools/carousel/output/template-validation.json
            tools/social-renderer/output/atlas-news-social-card-1200x630.png
          if-no-files-found: warn
          retention-days: 14
