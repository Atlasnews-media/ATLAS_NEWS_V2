name: Format IPSA adapter once

on:
  push:
    branches: [fix/ipsa-diario-financiero]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ipsa-diario-financiero
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/update-market-pulse.mjs
      - name: Guardar formato y retirar workflow temporal
        run: |
          rm .github/workflows/format-ipsa-fix-once.yml
          git config user.name "ATLAS NEWS Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/update-market-pulse.mjs .github/workflows/format-ipsa-fix-once.yml
          git commit -m "style: apply prettier to IPSA adapter"
          git push origin HEAD:fix/ipsa-diario-financiero
