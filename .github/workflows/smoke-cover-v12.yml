name: Smoke Cover V12

on:
  push:
    branches:
      - feat/audio-cover-v12-editorial-contract

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validar contrato unitario
        run: npm run format:check

      - name: Clonar snapshot público vigente
        run: git clone --depth=1 https://github.com/EldeSiempre100/EldeSiempre100.github.io.git "$RUNNER_TEMP/atlas-news-public"

      - name: Planificar Portada V12 con fuentes productivas actuales
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ runner.temp }}/atlas-news-public
          ATLAS_AUDIO_PLAN: ${{ runner.temp }}/atlas-cover-v12-smoke.json
          ATLAS_AUDIO_OWNER: audio-v2
          ATLAS_AUDIO_VOICE: ef_dora
        run: node scripts/prepare-daily-audio.mjs

      - name: Verificar resultado editorial real
        env:
          PLAN: ${{ runner.temp }}/atlas-cover-v12-smoke.json
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const plan = JSON.parse(await readFile(process.env.PLAN, "utf8"));
          if (plan.scriptVersion !== 12) throw new Error(`scriptVersion inesperada: ${plan.scriptVersion}`);
          if (!plan.contract?.valid) throw new Error(`Contrato V12 inválido: ${(plan.contract?.errors ?? []).join(" | ")}`);
          if (plan.wordCount < 600 || plan.wordCount > 810) throw new Error(`Extensión fuera de rango duro: ${plan.wordCount}`);
          for (const marker of ["dólar observado", "El euro", "La UF vigente"]) {
            if (!plan.script.includes(marker)) throw new Error(`Falta en snapshot: ${marker}`);
          }
          if (plan.script.includes("En el último registro disponible")) throw new Error("Persistió el disclaimer de apertura.");
          if (plan.script.includes("Treasury de Estados Unidos")) throw new Error("Persistió la redundancia Treasury de Estados Unidos.");
          console.log(JSON.stringify({
            scriptVersion: plan.scriptVersion,
            wordCount: plan.wordCount,
            estimatedDurationSeconds: plan.estimatedDurationSeconds,
            qualityScore: plan.contract.qualityScore,
            blockWords: plan.contract.blockWords,
            warnings: plan.contract.warnings,
            sourceIds: plan.sourceIds,
          }, null, 2));
          console.log("\n--- GUIÓN V12 ---\n");
          console.log(plan.script);
          NODE
