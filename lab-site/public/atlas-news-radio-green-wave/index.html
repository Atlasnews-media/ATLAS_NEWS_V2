<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#f2efe5" />
    <title>ATLAS NEWS RADIO — LAB</title>
    <link rel="stylesheet" href="/lab/atlas-news-radio-green-wave.css" />
  </head>
  <body>
    <main class="portada-slice">
      <p class="economic-source">
        Fuentes: Mi Indicador · Índices de mercado ATLAS · Datos al:
        <time datetime="2026-09-19">19 sept 2026</time>
      </p>

      <section
        class="daily-audio"
        data-radio-lab
        aria-labelledby="daily-audio-title"
      >
        <div class="audio-copy">
          <p class="audio-kicker" id="daily-audio-title">ATLAS NEWS RADIO</p>
        </div>

        <div class="audio-player">
          <div class="radio-player" data-radio-player>
            <button
              class="radio-toggle"
              type="button"
              data-radio-toggle
              aria-label="Reproducir Resumen diario de ATLAS NEWS"
              aria-pressed="false"
            >
              <span class="radio-icon" data-radio-icon aria-hidden="true"></span>
            </button>

            <span class="radio-time" data-radio-current>00:00</span>

            <div
              class="radio-waveform"
              data-radio-waveform
              role="slider"
              tabindex="0"
              aria-label="Posición de Resumen diario de ATLAS NEWS"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              aria-valuetext="00:00 de 04:57"
            ></div>

            <span class="radio-duration" data-radio-duration>04:57</span>
          </div>

          <audio
            class="radio-fallback"
            data-radio-fallback
            src="/audio/2026-09-19-resumen-diario.mp3"
            preload="metadata"
            aria-label="Resumen diario de ATLAS NEWS"
            controls
            hidden
          ></audio>
        </div>
      </section>

      <div class="editorial-double-rule" aria-hidden="true"></div>

      <section class="context-tabs" aria-label="Contexto visual de Portada">
        <span class="context-tab context-tab--active">TITULARES</span>
        <span class="context-tab">SEÑALES DEL DÍA</span>
      </section>
    </main>

    <script
      type="module"
      src="/lab/atlas-news-radio-green-wave.js"
    ></script>
  </body>
</html>
